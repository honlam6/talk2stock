<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>经营看板 · Talk2Stock</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">

  <div class="db-head">
    <div>
      <div class="db-title" id="mTitle">经营概况</div>
      <div class="db-subtitle">老板视角 · 只读 · 数据更新于 <span id="updAt">—</span></div>
    </div>
    <button class="btn btn-sm" id="refresh">↻ 刷新</button>
  </div>

  <!-- 月度数据跑马灯（与首页同一组件，滚动本月经营要点） -->
  <div class="marquee mb-4" id="marquee" hidden>
    <div class="marquee-track" id="marqueeTrack"></div>
  </div>

  <div class="kpi-grid" id="kpiRow"></div>

  <!-- AI 经营洞察：规则事实 + LLM 组织语言，数字全部接地可追溯；日报在其下展开 -->
  <div class="card mb-4" id="aiCard">
    <h2><span class="bar"></span>AI 经营洞察
      <span class="muted" style="font-size:12px;font-weight:400" id="insSrc"></span>
      <span class="flex-1"></span>
      <button class="btn btn-sm" id="reportBtn">生成日报</button>
    </h2>
    <div id="insBox"><div class="skel skel-bar"></div><div class="skel skel-bar w-80"></div></div>
    <div id="reportBox" hidden></div>
  </div>

  <div class="db-grid">
    <div class="card">
      <h2><span class="bar"></span>经营趋势
        <span class="flex-1"></span>
        <span class="db-toggle" id="trendToggle">
          <button data-m="month" class="on">近 6 个月</button>
          <button data-m="daily">本月每日</button>
        </span>
      </h2>
      <div class="db-chart" id="trendChart">
        <div class="db-legend mb-3">
          <span><i style="background:var(--gold)"></i>采购</span>
          <span><i style="background:var(--jade)"></i>销售</span>
        </div>
        <div id="trendBox"><div class="skel skel-block"></div></div>
      </div>
    </div>

    <div class="card">
      <h2><span class="bar"></span>资金与待办</h2>
      <div id="fundBox"><div class="skel skel-bar"></div><div class="skel skel-bar w-80"></div><div class="skel skel-bar w-60"></div></div>
    </div>
  </div>

  <div class="two-col">
    <div class="card">
      <h2><span class="bar"></span>商品进销榜 <span class="muted" style="font-size:13px;font-weight:400">累计 · 官方进销存统计</span></h2>
      <div id="goodsBox"><div class="skel skel-bar"></div><div class="skel skel-bar w-80"></div><div class="skel skel-bar w-60"></div></div>
    </div>

    <div class="card">
      <h2><span class="bar"></span>库存预警</h2>
      <div id="stockSum" class="muted" style="margin-bottom:8px"></div>
      <div id="stockBox"></div>
    </div>
  </div>

  <div class="two-col">
    <div class="card">
      <h2><span class="bar"></span>往来排行 <span class="muted" style="font-size:13px;font-weight:400">累计发生额 TOP5</span></h2>
      <div id="partyBox"><div class="skel skel-bar"></div><div class="skel skel-bar w-80"></div></div>
    </div>

    <div class="card">
      <h2><span class="bar"></span>往来欠款</h2>
      <div id="debtBox"><div class="skel skel-bar"></div><div class="skel skel-bar w-40"></div></div>
    </div>
  </div>

  <div class="card">
    <h2><span class="bar"></span>最近单据 <span class="muted" id="recentCnt" style="font-size:13px;font-weight:400"></span></h2>
    <div class="tbl-wrap tbl-sticky db-recent-table">
      <table class="dtable" id="recentTbl">
        <thead><tr>
          <th>日期</th><th>类型</th><th>单号</th><th>往来单位</th><th>商品</th>
          <th class="num">金额</th><th>状态</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <!-- 窄屏（<=640px）改用卡片列表，宽度不够时表格整体隐藏，见 style.css -->
    <div class="db-recent-cards" id="recentCards"></div>
  </div>
  <div class="db-foot" id="footBox"></div>

</div>

<script src="/common.js"></script>
<script>
shell('/dashboard');

let D = null;          // 最新一次 /api/dashboard 数据
let trendMode = 'month';
let renderTmr = null;

/* ---------- 小工具 ---------- */
const shortMoney = v => {
  v = +v || 0;
  const a = Math.abs(v);
  if (a >= 1e8) return (v / 1e8).toFixed(a >= 1e9 ? 0 : 1) + '亿';
  if (a >= 1e4) return (v / 1e4).toFixed(a >= 1e5 ? 0 : 1) + '万';
  return a >= 1000 ? Math.round(v).toLocaleString('zh-CN') : (Math.round(v * 10) / 10).toString();
};
const niceCeil = v => {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
  return v * 10;
};
const pct = (cur, prev) => (prev > 0 && cur >= 0) ? Math.round((cur - prev) / prev * 100) : null;

function deltaChip(cur, prev, dir) {
  // dir: 'up-good' 销售/毛利涨为好；'neutral' 采购涨跌中性
  const p = pct(cur, prev);
  if (p === null) return '<span class="db-delta flat">上月无数据</span>';
  if (p === 0) return '<span class="db-delta flat">与上月持平</span>';
  const up = p > 0;
  const cls = up ? 'up' : 'down';
  const arrow = up ? '↑' : '↓';
  return `<span class="db-delta ${cls}">${arrow} ${Math.abs(p)}%</span> <span class="muted" style="font-size:12px">较上月</span>`;
}

/* ---------- 折线 + 面积图（月趋势） ---------- */
function trendSVG(buy, sell) {
  const box = $('#trendBox');
  if (!buy || !buy.length) { box.innerHTML = '<div class="empty"><div class="e-ico">📉</div><div class="e-t">暂无趋势数据</div><div class="e-d">录单后，近 6 个月的采购/销售曲线会自动出现在这里。</div></div>'; return; }
  const compact = $('#trendChart').clientWidth < 560;
  const W = compact ? 420 : 760, H = compact ? 250 : 300;
  const L = compact ? 44 : 58, R = 14, T = 18, B = compact ? 30 : 38;
  const iw = W - L - R, ih = H - T - B;
  const step = niceCeil(Math.max(1, ...buy.map(p => +p.y || 0), ...sell.map(p => +p.y || 0)) * 1.06 / 4);
  const top = step * 4;
  const X = i => L + (buy.length === 1 ? iw / 2 : i * iw / (buy.length - 1));
  const Y = v => T + ih - (v / top) * ih;
  const lp = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const ap = (pts, base) => lp(pts) + ` L ${pts[pts.length - 1][0].toFixed(1)} ${base} L ${pts[0][0].toFixed(1)} ${base} Z`;
  const mk = arr => arr.map((p, i) => [X(i), Y(+p.y || 0)]);

  const pb = mk(buy), ps = mk(sell);
  const allZero = buy.every(p => !+p.y) && sell.every(p => !+p.y);
  let grid = '', xl = '';
  for (let g = 0; g <= 4; g++) {
    const v = top * g / 4, y = Y(v);
    grid += `<line x1="${L}" y1="${y}" x2="${W - R}" y2="${y}" stroke="#e9e4d4" stroke-width="1"/>
             <text x="${L - 7}" y="${y + 4}" text-anchor="end" font-size="${compact ? 10 : 11.5}" fill="#98a08d">${shortMoney(v)}</text>`;
  }
  const xstep = buy.length > 8 ? 2 : 1;
  buy.forEach((p, i) => {
    if (i % xstep) return;
    xl += `<text x="${X(i)}" y="${H - 10}" text-anchor="middle" font-size="${compact ? 10 : 11.5}" fill="#98a08d">${esc(String(p.x).slice(5))}月</text>`;
  });

  box.innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <defs>
      <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c29a3b" stop-opacity=".22"/><stop offset="1" stop-color="#c29a3b" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gs" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1e7d5a" stop-opacity=".18"/><stop offset="1" stop-color="#1e7d5a" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${grid}${xl}
    ${ap(pb, T + ih)}<path d="${lp(pb)}" fill="none" stroke="#c29a3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${ap(ps, T + ih)}<path d="${lp(ps)}" fill="none" stroke="#1e7d5a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${pb.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="#fff" stroke="#c29a3b" stroke-width="2"/>`).join('')}
    ${ps.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="#fff" stroke="#1e7d5a" stroke-width="2"/>`).join('')}
    <g id="tHov" style="display:none">
      <line id="tHovLine" y1="${T}" y2="${T + ih}" stroke="#c9bd9b" stroke-dasharray="3 3"/>
      <circle id="tHovB" r="4.5" fill="#c29a3b" stroke="#fff" stroke-width="2"/>
      <circle id="tHovS" r="4.5" fill="#1e7d5a" stroke="#fff" stroke-width="2"/>
    </g>
    <rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent" id="tHit"/>
  </svg>
  ${allZero ? '<div class="muted center" style="margin-top:6px">近 6 个月暂无发生额，录单后会自动出现在这里</div>' : ''}`;

  // 悬停十字线 + 提示（先清掉上次渲染残留的提示层）
  $$('.db-tip', $('#trendChart')).forEach(t => t.remove());
  const svg = box.querySelector('svg'), hit = $('#tHit', svg), hov = $('#tHov', svg);
  const tip = document.createElement('div');
  tip.className = 'db-tip';
  $('#trendChart').appendChild(tip);
  const move = e => {
    const r = svg.getBoundingClientRect(), sc = W / r.width;
    const mx = (e.clientX - r.left) * sc;
    let i = Math.round((mx - L) / (iw / Math.max(1, buy.length - 1)));
    i = Math.max(0, Math.min(buy.length - 1, i));
    const b = +buy[i].y || 0, s = +(sell[i] || {}).y || 0;
    hov.style.display = '';
    $('#tHovLine', svg).setAttribute('x1', X(i)); $('#tHovLine', svg).setAttribute('x2', X(i));
    $('#tHovB', svg).setAttribute('cx', X(i)); $('#tHovB', svg).setAttribute('cy', Y(b));
    $('#tHovS', svg).setAttribute('cx', X(i)); $('#tHovS', svg).setAttribute('cy', Y(s));
    tip.style.opacity = 1;
    tip.innerHTML = `<b>${esc(String(buy[i].x).slice(0, 7))}</b><br>采购 ￥${money(b)}<br>销售 ￥${money(s)}`;
    const box2 = $('#trendChart').getBoundingClientRect();
    tip.style.left = Math.max(4, Math.min(box2.width - tip.offsetWidth - 4, X(i) / sc - tip.offsetWidth / 2)) + 'px';
    tip.style.top = '8px';
  };
  const leave = () => { hov.style.display = 'none'; tip.style.opacity = 0; };
  hit.addEventListener('mousemove', move);
  hit.addEventListener('mouseleave', leave);
}

/* ---------- 每日柱状图 ---------- */
function dailySVG(daily, month) {
  const box = $('#trendBox');
  if (!daily || !daily.length) { box.innerHTML = '<div class="empty"><div class="e-ico">🗓</div><div class="e-t">本月还没有每日数据</div><div class="e-d">切到「近 6 个月」看整体趋势，或先去录一单。</div></div>'; return; }
  const compact = $('#trendChart').clientWidth < 560;
  const W = compact ? 420 : 760, H = compact ? 250 : 300;
  const L = compact ? 44 : 58, R = 14, T = 18, B = compact ? 30 : 38;
  const iw = W - L - R, ih = H - T - B;
  const step = niceCeil(Math.max(1, ...daily.map(p => Math.max(p.buy, p.sell))) * 1.06 / 4);
  const top = step * 4;
  const n = daily.length;
  const gw = iw / n;
  const bw = Math.max(3, Math.min(14, gw / 2 - 2));
  const Y = v => T + ih - (v / top) * ih;
  let grid = '', bars = '', xl = '';
  for (let g = 0; g <= 4; g++) {
    const v = top * g / 4, y = Y(v);
    grid += `<line x1="${L}" y1="${y}" x2="${W - R}" y2="${y}" stroke="#e9e4d4"/>
             <text x="${L - 7}" y="${y + 4}" text-anchor="end" font-size="${compact ? 10 : 11.5}" fill="#98a08d">${shortMoney(v)}</text>`;
  }
  daily.forEach((p, i) => {
    const cx = L + gw * i + gw / 2;
    const bh = b => b > 0 ? (T + ih - Y(b)) : 0;
    bars += `<g class="db-bar" data-i="${i}">
      <rect x="${(cx - bw - 1).toFixed(1)}" y="${(T + ih - bh(p.buy)).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh(p.buy).toFixed(1)}" rx="2" fill="#c29a3b"><title>${month}-${p.x} 采购 ￥${money(p.buy)}</title></rect>
      <rect x="${(cx + 1).toFixed(1)}" y="${(T + ih - bh(p.sell)).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh(p.sell).toFixed(1)}" rx="2" fill="#1e7d5a"><title>${month}-${p.x} 销售 ￥${money(p.sell)}</title></rect>
    </g>`;
    if (n <= 16 || i % Math.ceil(n / 12) === 0 || i === n - 1)
      xl += `<text x="${cx}" y="${H - 10}" text-anchor="middle" font-size="${compact ? 9.5 : 11}" fill="#98a08d">${p.x}</text>`;
  });

  box.innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${grid}${bars}${xl}
  </svg>
  <div class="muted center" style="margin-top:6px">含未审核草稿单；退货按负向冲减</div>`;
}

/* ---------- KPI ---------- */
function renderKPI() {
  const O = D.official || {};
  const m = O.month || D.month_stat || D.all || {};
  const t = O.today || D.today || {};
  const tb = (O.trend || {}).buy || [], ts = (O.trend || {}).sell || [];
  const prevKey = (() => {
    const [y, mo] = D.month.split('-').map(Number);
    return mo === 1 ? `${y - 1}-12` : `${y}-${String(mo - 1).padStart(2, '0')}`;
  })();
  const prevBuy = +(tb.find(p => p.x === prevKey) || {}).y || 0;
  const prevSell = +(ts.find(p => p.x === prevKey) || {}).y || 0;
  const prevProfit = prevSell - prevBuy;
  const sm = O.stock_money || {};

  $('#mTitle').textContent = D.month + ' 经营概况';
  $('#kpiRow').innerHTML =
    kpi('', '本月采购', '￥' + money(m.buy),
        `${t.buy_n || 0} 张单 · 今日 ￥${money(t.buy)}`) +
    kpi('g', '本月销售', '￥' + money(m.sell),
        `${t.sell_n || 0} 张单 · 今日 ￥${money(t.sell)}`) +
    kpi(m.profit >= 0 ? 'b' : 'r', '本月毛利（销售 − 采购）', '￥' + money(m.profit), '') +
    kpi('o', '库存货值（成本价）', '￥' + money(sm.total_value),
        `${sm.total_stock || 0} 件 · ${D.stock.kinds || 0} 种商品`);

  // 环比 chip 塞进 KPI（销售/毛利着色，采购中性）
  const cards = $('#kpiRow').children;
  const sub = (el, html) => { const s = el.querySelector('.sub'); s.innerHTML = html; };
  sub(cards[0], `${cards[0].querySelector('.sub').textContent}　${deltaChip(m.buy, prevBuy, 'neutral')}`);
  sub(cards[1], `${cards[1].querySelector('.sub').textContent}　${deltaChip(m.sell, prevSell, 'up-good')}`);
  sub(cards[2], deltaChip(m.profit, prevProfit, 'up-good'));
  if ((D.stock.negative || 0) > 0)
    sub(cards[3], `${cards[3].querySelector('.sub').textContent} · <span style="color:#b5532f;font-weight:600">负库存 ${D.stock.negative} 种</span>`);

  renderMarquee(m, sm, t);
}

/* ---------- 月度跑马灯（复用首页 .marquee 组件） ---------- */
function renderMarquee(m, sm, t) {
  const O = D.official || {};
  const recv = +(D.debt_recv_total || 0), pay = +(D.debt_pay_total || 0);
  const items = [
    ['', `本月采购 <b>￥${money(m.buy)}</b>`],
    ['', `本月销售 <b>￥${money(m.sell)}</b>`],
    [(m.profit || 0) >= 0 ? 'up' : 'down', `本月毛利 <b>￥${money(m.profit)}</b>`],
    ['', `今日采购 <b>￥${money(t.buy)}</b> · 销售 <b>￥${money(t.sell)}</b>`],
    ['', `库存货值 <b>￥${money(sm.total_value)}</b>`],
    [recv > 0 ? 'down' : 'up', `应收 <b>￥${money(recv)}</b>`],
    [pay > 0 ? 'down' : 'up', `应付 <b>￥${money(pay)}</b>`],
    [(D.stock.negative || 0) > 0 ? 'down' : 'up', `库存预警 <b>${(D.stock.negative || 0) + (D.stock.low || 0)}</b> 种`],
    ['', `待审核 <b>${O.wait_bills != null ? O.wait_bills : 0}</b> 张`],
    ['up', '本页只读 · 数字实时取自 ERP 官方统计接口'],
  ];
  const one = items.map(([c, x]) => `<span class="marquee-item ${c}"><span class="dot"></span>${x}</span>`).join('');
  $('#marqueeTrack').innerHTML = one + one;   // 两份拼接实现无缝滚动
  $('#marquee').hidden = false;
}

function kpi(cls, label, val, subTxt) {
  return `<div class="kpi ${cls}">
    <div class="lbl">${esc(label)}</div>
    <div class="val">${val}</div>
    <div class="sub">${esc(subTxt || '')}</div>
  </div>`;
}

/* ---------- 加载骨架屏（首次进入/刷新时先铺占位） ---------- */
function renderSkeletons() {
  $('#marquee').hidden = true;
  $('#kpiRow').innerHTML = ['b', 'g', 'b', 'o'].map(c => `
    <div class="kpi skeleton-card ${c}">
      <div class="lbl skel" style="width:52%;height:11px"></div>
      <div class="val skel skel-val"></div>
      <div class="sub skel skel-text w-80"></div>
    </div>`).join('');
  $('#trendBox').innerHTML = '<div class="skel skel-block"></div>';
  $('#fundBox').innerHTML = '<div class="skel skel-val" style="width:46%"></div>' +
    '<div class="skel skel-bar"></div><div class="skel skel-bar w-80"></div><div class="skel skel-bar w-60"></div>';
  $('#goodsBox').innerHTML = '<div class="skel skel-bar"></div><div class="skel skel-bar w-80"></div>' +
    '<div class="skel skel-bar w-60"></div><div class="skel skel-bar w-40"></div>';
  $('#stockSum').innerHTML = '<div class="skel" style="display:inline-block;width:180px;height:13px;vertical-align:middle"></div>';
  $('#stockBox').innerHTML = '<div class="skel skel-bar"></div><div class="skel skel-bar w-80"></div><div class="skel skel-bar w-60"></div>';
  $('#partyBox').innerHTML = '<div class="skel skel-title"></div>' +
    '<div class="skel skel-bar"></div><div class="skel skel-bar w-60"></div>';
  $('#debtBox').innerHTML = '<div class="skel skel-title"></div>' +
    '<div class="skel skel-bar"></div><div class="skel skel-bar w-40"></div>';
  if (window.matchMedia('(max-width: 640px)').matches) {
    $('#recentCards').innerHTML = ['', '', ''].map(() =>
      '<div class="bill-card"><div class="skel skel-bar"></div><div class="skel skel-text w-60"></div></div>').join('');
    $('#recentTbl tbody').innerHTML = '';
  } else {
    $('#recentCards').innerHTML = '';
    $('#recentTbl tbody').innerHTML = ['', '', '', ''].map(() =>
      `<tr>${['', '', '', '', '', '', ''].map(() => '<td><div class="skel skel-text" style="margin:4px 0"></div></td>').join('')}</tr>`).join('');
  }
  $('#updAt').textContent = '加载中…';
}

/* ---------- 资金与待办 ---------- */
function renderFund() {
  const O = D.official || {};
  const accs = D.accounts || [];
  const total = accs.reduce((a, x) => a + x.amount, 0);
  const max = Math.max(1, ...accs.map(x => x.amount));
  const box = $('#fundBox');
  const chips = [
    ['待审核单据', O.wait_bills != null ? O.wait_bills : '—', 'blue'],
    ['待收款单据', O.need_recv != null ? O.need_recv : '—', 'orange'],
    ['待付款单据', O.need_pay != null ? O.need_pay : '—', 'red'],
  ];
  box.innerHTML = `
    <div class="db-big">￥<b>${money(total)}</b><span class="db-big-lbl">账户总余额${O.account && O.account.month ? ` · 本月发生 ￥${money(O.account.month)}` : ''}</span></div>
    ${accs.length ? accs.map(x => `
      <div class="hbar-row">
        <span class="nm" title="${esc(x.name)}">${esc(x.name)}</span>
        <span class="track"><span class="fill" style="width:${(x.amount / max * 100).toFixed(1)}%"></span></span>
        <span class="amt">￥${money(x.amount)}</span>
      </div>`).join('')
      : '<div class="muted mt-1">还没有资金账户</div>'}
    <div class="db-chips">
      ${chips.map(([l, v, c]) => `<div class="db-chip db-c-${c}"><b>${v}</b><span>${l}</span></div>`).join('')}
    </div>`;
}

/* ---------- 商品进销榜 ---------- */
function renderGoods() {
  const g = D.goods || {};

    <div class="db-chips" style="margin-bottom:10px">
      <div class="db-chip db-c-blue"><b>${g.total_in || 0}</b><span>累计进货量</span></div>
      <div class="db-chip db-c-green"><b>${g.total_out || 0}</b><span>累计出货量</span></div>
      <div class="db-chip db-c-orange"><b>￥${money(g.total_value)}</b><span>库存货值</span></div>

      <tbody>${rows.map(r => `
        <tr>

/* ---------- 库存预警 ---------- */
function renderStock() {
  const s = D.stock || {};
  const list = s.warn_list || [];
  $('#stockSum').innerHTML =
    `共 <b>${s.kinds || 0}</b> 种商品　` +
    `<span class="tag tag-new">低库存 ${s.low || 0}</span>` +
    ((s.negative || 0) > 0 ? `　<span class="tag" style="background:var(--rust-bg);color:#b5532f">负库存 ${s.negative}</span>` : '');
  const box = $('#stockBox');
  if (!list.length) { box.innerHTML = '<div class="empty"><div class="e-ico">✅</div><div class="e-t">库存都很充足</div><div class="e-d">没有低库存或负库存商品，不需要补货。</div></div>'; return; }
  box.innerHTML = list.slice(0, 9).map(r => {
    const ratio = Math.max(0, Math.min(100, r.stock / Math.max(r.threshold, 1) * 100));
    const color = r.stock < 0 ? '#b5532f' : (r.stock === 0 ? '#a87f26' : '#e8c97a');
    return `
    <div class="hbar-row">
      <span class="nm" title="${esc(r.name)}">${esc(r.name)}</span>
      <span class="track" style="height:12px"><span class="fill" style="width:${ratio.toFixed(1)}%;background:${color}"></span></span>
      <span class="amt" style="color:${r.stock < 0 ? '#b5532f' : 'inherit'};font-weight:600">${r.stock}<span class="muted" style="font-weight:400;font-size:12px"> ${esc(r.unit || '')}</span></span>
    </div>`;
  }).join('') +
  (list.length > 9 ? `<div class="muted center" style="font-size:13px;padding-top:6px">还有 ${list.length - 9} 种未列出…</div>` : '');
}

/* ---------- 往来欠款 + 账龄 ---------- */
function renderDebt() {
  const box = $('#debtBox');
  const AGING_COLORS = ['#e8c97a', '#d99a4e', '#b5532f'];
  const AGING_COLORS2 = ['#b8cfae', '#7fb08f', '#1e7d5a'];
  const sec = (title, list, total, topList, colors, emptyTip) => {
    const maxA = Math.max(1, ...list.map(x => x.amount));
    const sum = list.reduce((a, x) => a + x.amount, 0) || 1;
    let stacked = '', offset = 0;
    if (sum > 1) {
      const segs = list.map((x, i) => {
        const w = x.amount / sum * 100;
        const s = `<span style="display:inline-block;width:${w.toFixed(2)}%;height:100%;background:${colors[i % colors.length]}${offset === 0 ? ';border-radius:6px 0 0 6px' : ''}" title="${esc(x.name)} ￥${money(x.amount)}"></span>`;
        offset += w;
        return s;
      }).join('');
      stacked = `<div style="display:flex;height:10px;border-radius:6px;overflow:hidden;background:#f0f2f5;margin:6px 0 8px">${segs}</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--text-2);margin-bottom:8px">
          ${list.map((x, i) => `<span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${colors[i % colors.length]};margin-right:4px"></i>${esc(x.name)} ￥${money(x.amount)}</span>`).join('')}
        </div>`;
    }
    return `
    <div style="margin-bottom:16px">
      <div style="display:flex;align-items:baseline;gap:8px">
        <b>${title}</b>
        <span class="amount" style="font-size:19px">${total > 0 ? '￥' + money(total) : '—'}</span>
      </div>
      ${stacked}
      ${topList.length ? `<table class="dtable" style="font-size:14px">
        ${topList.map(x => `<tr><td>${esc(x.name)}</td><td class="num" style="font-weight:600">￥${money(x.amount)}</td></tr>`).join('')}
      </table>` : `<div class="muted" style="font-size:13.5px">${emptyTip}</div>`}
    </div>`;
  };
  box.innerHTML =
    sec('客户欠我（应收）', D.aging.recv || [], D.debt_recv_total, D.debt_recv || [], AGING_COLORS, '没有未结清的应收款 🎉') +
    sec('我欠供应商（应付）', D.aging.pay || [], D.debt_pay_total, D.debt_pay || [], AGING_COLORS2, '没有未结清的应付款 🎉');
}

/* ---------- 最近单据（可排序 + 点击表头切换升降序） ---------- */
const SUB_CLS = {
  '采购': 't-blue', '其它': 't-gray', '盘点录入': 't-gray', '组装单': 't-gray', '拆卸单': 't-gray',
  '销售': 't-green', '零售': 't-green', '调拨': 't-gray',
  '采购退货': 't-red', '销售退货': 't-red', '零售退货': 't-red',
};
const RECENT_COLS = [
  { key: 'time',   type: 's' },
  { key: 'type',   type: 's' },
  { key: 'number', type: 's' },
  { key: 'party',  type: 's' },
  { key: 'goods',  type: 's' },
  { key: 'total',  type: 'n' },
  { key: 'status', type: 's' },
];
let recentSort = { col: 0, desc: true };
let recentNarrow = null;   // 当前是否为窄屏卡片模式（跨 640px 断点时重渲染）
let recentFilter = 'all';  // 窄屏卡片筛选：all / in / out / draft
const RECENT_FILTERS = [
  ['all', '全部'],
  ['in', '入库'],
  ['out', '出库'],
  ['draft', '草稿'],
];

function renderRecent() {
  let rows = (D && D.recent) || [];
  const narrow = window.matchMedia('(max-width: 640px)').matches;
  recentNarrow = narrow;
  $('#recentCnt').textContent = rows.length
    ? `（最近 ${rows.length} 张 / 共 ${D.bill_count || rows.length} 张${narrow ? '' : ' · 点表头排序'}）`
    : '';
  const c = RECENT_COLS[recentSort.col];
  rows = rows.slice().sort((a, b) => {
    const x = a[c.key], y = b[c.key];
    const r = c.type === 'n' ? (Number(x) || 0) - (Number(y) || 0)
      : String(x || '').localeCompare(String(y || ''), 'zh-CN');
    return recentSort.desc ? -r : r;
  });

  const emptyHtml = '<div class="empty"><div class="e-ico">📄</div><div class="e-t">还没有单据</div>' +
    '<div class="e-d">去「对话录单」说一句话就能开单，写入后会出现在这里。</div>' +
    '<div class="e-act"><a class="btn btn-primary" href="/new?mode=ai">去录第一单 →</a></div></div>';

  // 筛选 chips 桌面和窄屏都渲染（功能不因设备割裂），只有"折叠"是窄屏专属：
  // 桌面表格本身有吸顶表头 + 460px 内部滚动，一屏能扫完，不需要折叠。
  const chips = renderFilterChips(rows);
  if (narrow) { renderRecentCards(rows, emptyHtml, chips); return; }

  $('#recentCards').innerHTML = chips;
  bindFilterChips();
  bindBillDetail();
  const trows = filterRows(rows);
  $('#recentTbl thead').innerHTML = `<tr>${['日期', '类型', '单号', '往来单位', '商品', '金额', '状态']
    .map((h, i) => `<th class="sortable${i === recentSort.col ? ' sorted' : ''}${i === recentSort.col && recentSort.desc ? ' desc' : ''}" data-c="${i}">${h}</th>`).join('')}</tr>`;
  $('#recentTbl tbody').innerHTML = trows.length
    ? trows.map((r, i) => {
        const sub = (r.type || '').split('·')[1] || r.type;
        const isIn = (r.type || '').indexOf('入库') === 0;
        const cls = SUB_CLS[sub] || (isIn ? 't-blue' : 't-green');
        return `<tr data-idx="${i}">
          <td class="muted" style="white-space:nowrap">${esc(r.time)}</td>
          <td><span class="typ-pill ${cls}">${esc(r.type)}</span></td>
          <td style="font-family:ui-monospace,Menlo,monospace;font-size:13.5px">${esc(r.number)}</td>
          <td>${esc(r.party)}</td>
          <td class="muted">${esc(r.goods)}</td>
          <td class="num"><b>￥${money(r.total)}</b>${r.debt > 0 ? `<br><span class="hint" style="color:#a87f26">未结 ￥${money(r.debt)}</span>` : ''}</td>
          <td>${r.status === '已审核' ? '<span class="typ-pill t-green">已审核</span>' : '<span class="typ-pill t-orange">草稿</span>'}</td>
        </tr>`;
      }).join('')
    : `<tr><td colspan="7">${emptyHtml}</td></tr>`;
}

/* 窄屏：卡片列表 + 筛选 chips + 默认只显示前 6 张（其余折叠）
   目的是数据多了不「大海捞针」，也不让一屏全被单据占满。
   注：filterRows / renderFilterChips 已在上方定义，桌面表格同样复用。 */
const RECENT_PAGE = 6;
let recentExpanded = false;

/* 按当前筛选键过滤单据行 */
function filterRows(rows) {
  if (recentFilter === 'in') return rows.filter(r => (r.type || '').indexOf('入库') === 0);
  if (recentFilter === 'out') return rows.filter(r => (r.type || '').indexOf('出库') === 0);
  if (recentFilter === 'draft') return rows.filter(r => r.status !== '已审核');
  return rows;
}

/* 筛选 chips（桌面 + 窄屏共用，功能不割裂） */
function renderFilterChips(rows) {
  const counts = { all: rows.length, in: 0, out: 0, draft: 0 };
  rows.forEach(r => {
    if ((r.type || '').indexOf('入库') === 0) counts.in++;
    if ((r.type || '').indexOf('出库') === 0) counts.out++;
    if (r.status !== '已审核') counts.draft++;
  });
  return `<div class="fchips" id="recentFilters">${RECENT_FILTERS.map(([k, label]) =>
    `<button class="fchip${recentFilter === k ? ' on' : ''}" data-f="${k}">${label}${counts[k] ? ' ' + counts[k] : ''}</button>`).join('')}</div>`;
}

function renderRecentCards(rows, emptyHtml, chips) {
  const shown = filterRows(rows);
  const head = chips || renderFilterChips(rows);

  if (!shown.length) {
    $('#recentCards').innerHTML = head + emptyHtml;
    bindFilterChips();
    return;
  }
  const limit = recentExpanded ? shown.length : RECENT_PAGE;
  const list = shown.map((r, i) => {
    if (i >= limit) return '';
    const sub = (r.type || '').split('·')[1] || r.type;
    const isIn = (r.type || '').indexOf('入库') === 0;
    const cls = SUB_CLS[sub] || (isIn ? 't-blue' : 't-green');
    return `<div class="bill-card${isIn ? ' bc-in' : ''}" data-idx="${i}">
      <div class="bc-top">
        <span class="typ-pill ${cls}">${esc(r.type)}</span>
        <span class="bc-no">${esc(r.number)}</span>
        <span class="bc-amt">￥${money(r.total)}</span>
      </div>
      <div class="bc-mid">
        <span class="bc-party">${esc(r.party)}</span>
        <span class="bc-goods">${esc(r.goods)}</span>
      </div>
      <div class="bc-bot">
        <span class="muted">${esc(r.time)}</span>
        ${r.debt > 0 ? `<span class="bc-debt">未结 ￥${money(r.debt)}</span>` : ''}
        <span class="typ-pill ${r.status === '已审核' ? 't-green' : 't-orange'}" style="margin-left:auto">${esc(r.status)}</span>
      </div>
    </div>`;
  }).join('');

  const more = shown.length > limit
    ? `<button class="btn btn-sm btn-ghost bc-more" id="recentMore">展开其余 ${shown.length - limit} 张 ↓</button>`
    : (recentExpanded && shown.length > RECENT_PAGE
      ? '<button class="btn btn-sm btn-ghost bc-more" id="recentMore">收起 ↑</button>' : '');

  $('#recentCards').innerHTML = head + list + more;
  bindFilterChips();
  bindBillDetail();          // 窄屏点卡片也要能看详情（和桌面表格行同一弹层）
  const btn = $('#recentMore');
  if (btn) btn.onclick = () => { recentExpanded = !recentExpanded; renderRecent(); };
}

function bindFilterChips() {
  const box = $('#recentFilters');
  if (!box) return;
  box.querySelectorAll('.fchip').forEach(c => c.onclick = () => {
    recentFilter = c.dataset.f;
    recentExpanded = false;
    renderRecent();
  });
}

/* ---------- 单据详情弹层（点卡片 / 点表格行都能看全量信息） ----------
   数据直接来自 recent 已带齐的详情字段，不再发一次请求。
   字段表：[键, 中文名, 取值函数, 是否独占一行]。中文名必填，杜绝英文 key 漏出。 */
const BILL_DETAIL_FIELDS = [
  ['number',     '单号',       r => r.number],
  ['type',       '类型',       r => r.type],
  ['party',      '往来单位',   r => r.party || '—'],
  ['goods',      '商品',       r => r.goods || '—', true],
  ['count',      '商品数量',   r => (r.count != null ? r.count + ' 件' : '—')],
  ['total',      '合计',       r => '￥' + money(r.total)],
  ['oper_time',  '单据日期',   r => r.oper_time || r.time],
  ['status',     '状态',       r => r.status],
  ['pay_type',   '收付方式',   r => r.pay_type || '—'],
  ['paid',       '实付/实收',  r => (r.paid ? '￥' + money(r.paid) : '—')],
  ['account_money', '账户发生额', r => (r.account_money ? '￥' + money(r.account_money) : '—')],
  ['account',    '结算账户',   r => r.account || '—'],
  ['discount',   '折扣率',     r => (r.discount ? r.discount + ' %' : '—')],
  // ERP 的 discountLastMoney 是「折后最终金额」而非优惠额，无折扣时等于合计，
  // 所以只在确有折扣率时才列这一行
  ['discount_money', '折后金额', r => (r.discount && r.discount_money ? '￥' + money(r.discount_money) : '—')],
  ['tax_rate',   '税率',       r => (r.tax_rate ? r.tax_rate + ' %' : '—')],
  ['other_money','其他费用',   r => (r.other_money ? '￥' + money(r.other_money) : '—')],
  ['debt',       '未结金额',   r => (r.debt ? '￥' + money(r.debt) : '已结清')],
  ['create_time','创建时间',   r => r.create_time || '—'],
  ['creator',    '创建人',     r => r.creator || '—'],
  ['salesman',   '业务员',     r => r.salesman || '—'],
  ['contacts',   '联系人',     r => r.contacts || '—'],
  ['phone',      '联系电话',   r => r.phone || '—'],
  ['remark',     '备注',       r => r.remark || '—', true],
  ['attachments','附件',       r => r.attachments || '无', true],
];

// 这些字段有值才显示，避免满屏「—」
const BILL_DETAIL_OPTIONAL = new Set(
  ['discount', 'discount_money', 'tax_rate', 'other_money', 'creator', 'salesman',
   'contacts', 'phone', 'account_money', 'remark', 'create_time', 'account']);
// 折后金额只在真有折扣时才出现（无折扣时它等于合计，列出来是冗余）
const BILL_DETAIL_HIDE_WHEN = { discount_money: () => !row0.discount };
let row0 = null;

function showBillDetail(row) {
  if (!row) return;
  row0 = row;
  const old = $('#__billMask');
  if (old) old.remove();

  const rows = BILL_DETAIL_FIELDS
    .filter(([k, , get]) =>
      (BILL_DETAIL_OPTIONAL.has(k) ? (row[k] !== '' && row[k] != null && row[k] !== 0) : true) &&
      (!BILL_DETAIL_HIDE_WHEN[k] || !BILL_DETAIL_HIDE_WHEN[k]()))
    .map(([, label, , wide]) =>
      `<div class="bd-row${wide ? ' wide' : ''}"><span class="bd-k">${esc(label)}</span><span class="bd-v">${esc(get(row))}</span></div>`)
    .join('');

  const mask = document.createElement('div');
  mask.id = '__billMask';
  mask.className = 'mask show';
  mask.setAttribute('role', 'dialog');
  mask.setAttribute('aria-modal', 'true');
  mask.innerHTML = `
    <div class="modal" style="max-width:520px">
      <button class="modal-x" aria-label="关闭">×</button>
      <h3 style="margin-bottom:2px">${esc(row.type)} <span class="bd-no">${esc(row.number)}</span></h3>
      <div class="bd-sub">${row.status === '已审核' ? '<span class="typ-pill t-green">已审核</span>' : '<span class="typ-pill t-orange">草稿</span>'}
        <span class="muted" style="margin-left:8px">${esc(row.time)}</span></div>
      <div class="bd-grid">${rows}</div>
    </div>`;
  document.body.appendChild(mask);
  const close = () => {
    if (detachBd) detachBd();
    mask.remove();
  };
  const detachBd = trapFocus(mask, close);
  mask.querySelector('.modal-x').onclick = close;
  mask.addEventListener('mousedown', e => { if (e.target === mask) close(); });
}

// 绑定：窄屏点卡片、宽屏点表格行（表头点击仍是排序，不弹详情）
function bindBillDetail() {
  const cards = $('#recentCards');
  if (cards) cards.onclick = e => {
    if (e.target.closest('.fchip') || e.target.closest('#recentMore')) return;
    const card = e.target.closest('.bill-card');
    if (!card) return;
    showBillDetail(filterRows((D && D.recent) || [])[+card.dataset.idx]);
  };
}

$('#recentTbl').addEventListener('click', e => {
  const th = e.target.closest('th.sortable');
  if (th) {
    const i = +th.dataset.c;
    recentSort = (recentSort.col === i) ? { col: i, desc: !recentSort.desc } : { col: i, desc: true };
    renderRecent();
    return;
  }
  // 点数据行 → 弹单据详情（与窄屏点卡片同一弹层，体验不割裂）
  const tr = e.target.closest('tbody tr');
  if (!tr || !D) return;
  const trows = filterRows((D.recent || []).slice().sort((a, b) => {
    const c = RECENT_COLS[recentSort.col];
    const x = a[c.key], y = b[c.key];
    const r = c.type === 'n' ? (Number(x) || 0) - (Number(y) || 0)
      : String(x || '').localeCompare(String(y || ''), 'zh-CN');
    return recentSort.desc ? -r : r;
  }));
  showBillDetail(trows[+tr.dataset.idx]);
});

function renderCharts() {
  const O = D.official || {};
  if (trendMode === 'month') trendSVG(O.trend && O.trend.buy || [], O.trend && O.trend.sell || []);
  else dailySVG(D.daily || [], D.month);
}
function renderAll() {
  renderKPI(); renderFund(); renderGoods(); renderStock(); renderParties(); renderDebt(); renderRecent(); renderFoot(); renderCharts();
}

async function load() {
  const btn = $('#refresh');
  btn.disabled = true; btn.textContent = '刷新中…';
  if (!D) renderSkeletons();     // 首次进入铺骨架；刷新时保留旧数据（避免闪空）
  try {
    const d = await api('/api/dashboard');
    if (!d.ok) { toast(d.message || '加载失败', 'bad'); return; }
    D = d;
    $('#updAt').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    renderAll();
  } catch (e) {
    toast(e.message, 'bad');
    if (!D) $('#trendBox').innerHTML = `<div class="empty"><div class="e-ico">📡</div><div class="e-t">看板没连上</div><div class="e-d">${esc(e.message)}</div><div class="e-act"><button class="btn btn-primary" onclick="load()">重试</button></div></div>`;
  } finally {
    btn.disabled = false; btn.textContent = '↻ 刷新';
  }
}

$('#refresh').onclick = load;

// ---------- AI 经营洞察 + 每日日报 ----------
async function loadInsights() {
  const box = $('#insBox');
  try {
    const r = await api('/api/insight');
    if (!r.ok) { box.innerHTML = `<div class="muted" style="font-size:13px">洞察暂不可用：${esc(r.message || '')}</div>`; return; }
    $('#insSrc').textContent = r.source === 'llm' ? '· 数字全部来自 ERP，可追溯' : '· 规则生成';
    box.innerHTML = (r.insights || []).map(c => `
      <div class="ins-card ${c.level === 'warn' ? 'ins-warn' : ''}">
        <div class="ins-t">${c.level === 'warn' ? '⚠' : '💡'} ${esc(c.title)}</div>
        <div class="ins-d">${esc(c.detail)}</div>
      </div>`).join('') || '<div class="muted">暂无可分析的经营活动</div>';
  } catch (e) {
    box.innerHTML = `<div class="muted" style="font-size:13px">洞察加载失败：${esc(e.message)}</div>`;
  }
}

let reportBusy = false;
async function genReport() {
  if (reportBusy) return;
  reportBusy = true;
  const btn = $('#reportBtn');
  btn.disabled = true; btn.textContent = '生成中…';
  const box = $('#reportBox');
  box.hidden = false;
  box.innerHTML = '<div class="skel skel-bar"></div><div class="skel skel-bar w-80"></div>';
  try {
    const r = await api('/api/daily-report');
    if (!r.ok) throw new Error(r.message || '生成失败');
    const ins = (r.insights || []).map(c =>
      `<li>${c.level === 'warn' ? '⚠' : '•'} <b>${esc(c.title)}</b>　${esc(c.detail)}</li>`).join('');
    const al = (r.alerts || []).map(a => `<li>${a.level === 'warn' ? '⚠' : '·'} ${esc(a.text)}</li>`).join('');
    const tpRaw = r.top_parties || {};
    const tp = [...(tpRaw.suppliers || []), ...(tpRaw.customers || [])]
      .sort((a, b) => (b.amount || 0) - (a.amount || 0)).slice(0, 5)
      .map(p => `<tr><td>${esc(p.name || '')}</td><td>${money(p.amount)}</td></tr>`).join('');
    box.innerHTML = `
      <div class="report-card">
        <div class="rp-head">
          <div class="rp-title">Talk2Stock 经营日报</div>
          <div class="rp-date">${esc(r.date || '')} · 由 AI 基于当日 ERP 数据生成</div>
        </div>
        <div class="rp-sec"><div class="rp-h">今日洞察</div><ul class="rp-list">${ins || '<li>今日暂无显著变化</li>'}</ul></div>
        ${al ? `<div class="rp-sec"><div class="rp-h">风险提示</div><ul class="rp-list">${al}</ul></div>` : ''}
        ${tp ? `<div class="rp-sec"><div class="rp-h">往来 TOP5（累计发生额）</div>
          <table class="dtable rp-tbl"><thead><tr><th>往来单位</th><th>金额</th></tr></thead><tbody>${tp}</tbody></table></div>` : ''}
      </div>`;
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch (e) {
    box.innerHTML = `<div class="muted">日报生成失败：${esc(e.message)}</div>`;
  } finally {
    reportBusy = false;
    btn.disabled = false; btn.textContent = '生成日报';
  }
}
$('#reportBtn').onclick = genReport;
loadInsights();

$('#trendToggle').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  trendMode = b.dataset.m;
  $$('#trendToggle button').forEach(x => x.classList.toggle('on', x === b));
  if (D) renderCharts();
});
window.addEventListener('resize', () => {
  if (!D) return;
  clearTimeout(renderTmr);
  renderTmr = setTimeout(() => {
    renderCharts();
    // 跨 640px 断点时表格 <-> 卡片切换要重渲染（窄屏卡片、宽屏可排序表）
    const narrow = window.matchMedia('(max-width: 640px)').matches;
    if (narrow !== recentNarrow) { recentNarrow = narrow; renderRecent(); }
  }, 220);
});
load();
</script>
</body>
</html>
