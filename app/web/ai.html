<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>对话录单 · Talk2Stock</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="nav"></div>

<div class="wrap">
  <div class="ai-grid">

    <div class="card" id="inputCard">
      <h2><span class="bar"></span>说一句话，自动建单
        <span class="spacer" style="flex:1"></span>
        <button class="btn btn-sm btn-ghost" id="cfgBtn" style="margin-left:auto">⚙ 模型设置</button>
      </h2>

      <div id="noModel" class="alert alert-warn" style="display:none">
        还没配置 AI 模型。点右上角「⚙ 模型设置」填入任意 OpenAI 兼容接口即可；
        或者直接用 <a href="/form">表单录入</a>（不需要 AI）。
      </div>

      <div class="say-row">
        <textarea id="text" rows="3"
          placeholder="例如：向美宜佳采购可乐 30瓶，单价3块5，入原料仓（⌘/Ctrl+Enter 快速解析）"></textarea>
        <button class="mic-btn" id="micBtn" title="语音输入（再点一次结束）" style="display:none">🎤</button>
      </div>

      <div id="correctChip" class="correct-chip hidden"></div>

      <div class="field" style="margin-top:10px">
        <div id="attachZone" class="attach-zone"></div>
      </div>

      <div class="hint" style="margin-top:12px">示例（点一下填入输入框，自己确认后再解析；库里没有的供应商 / 客户 / 商品，会自动新建档案后再写入单据）</div>
      <div class="examples" id="examples"></div>

      <div class="row-btns" style="margin-top:14px">
        <button class="btn btn-primary btn-lg" id="parseBtn">解析并预览 →</button>
        <span class="hint" id="modelTip"></span>
      </div>
    </div>

    <div class="card ai-side" id="convCard">
      <h2><span class="bar"></span>本次会话
        <span class="spacer" style="flex:1"></span>
        <button class="btn btn-sm btn-ghost" id="convClear">清空</button>
      </h2>
      <div class="conv-list" id="conv"></div>
    </div>

    <div class="card" id="recentCard" style="display:none">
      <h2><span class="bar"></span>最近录单
        <span class="spacer" style="flex:1"></span>
        <button class="btn btn-sm btn-ghost" id="recentRefresh">↻ 刷新</button>
      </h2>
      <div id="recentList"></div>
    </div>

  </div>
</div>

<!-- 模型设置弹窗 -->
<div class="mask" id="cfgMask" style="display:none">
  <div class="modal">
    <h2><span class="bar"></span>AI 模型设置</h2>
    <div class="hint">支持任何 OpenAI 兼容接口（OpenAI / DeepSeek / 通义 / Moonshot / 本地 Ollama 等）。密钥只存在本机服务端。</div>

    <div id="profList" style="margin:14px 0"></div>

    <details class="fold" id="addFold">
      <summary>＋ 添加 / 编辑模型</summary>
      <div class="fold-body">
        <div class="field"><label>显示名</label><input id="p_name" placeholder="例如 DeepSeek"></div>
        <div class="field"><label>Base URL</label><input id="p_base" placeholder="https://api.deepseek.com/v1"></div>
        <div class="field"><label>API Key</label><input id="p_key" type="password" placeholder="sk-…（编辑时留空表示不修改）"></div>
        <div class="field"><label>模型名</label><input id="p_model" placeholder="deepseek-chat"></div>
        <div class="field"><label>temperature</label><input id="p_temp" type="number" step="0.1" value="0"></div>
        <div class="row-btns">
          <button class="btn btn-ghost" id="p_test">测试连接</button>
          <button class="btn btn-primary" id="p_save">保存</button>
        </div>
        <div id="p_msg" class="hint"></div>
      </div>
    </details>

    <div class="row-btns" style="margin-top:16px">
      <button class="btn btn-ghost" id="cfgClose">关闭</button>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
let attachMgr = null;

$('#nav').innerHTML = topbar('/ai', '对话录单 · 单据智能体', '一句话 → 草稿 → 确认 → 写入 · 可就地改数 / 多轮修正 / 语音输入');

if (typeof AttachmentManager === 'function') {
  attachMgr = AttachmentManager($('#attachZone'), { biz: 'bill', max: 4 });
}

const EXAMPLES = [
  ['采购入库', '向美宜佳采购可乐 30瓶，单价3块5，入原料仓'],
  ['销售出库', '卖给永辉超市 纸箱 200个，单价5块，从成品仓出'],
  ['多商品采购', '向美宜佳采购 可乐30瓶单价3块5、纸箱200个单价5块，入原料仓'],
  ['多商品销售', '卖给张记便利店 方便面20箱单价45元、矿泉水50瓶单价2元，从成品仓出'],
  ['采购退货', '把美宜佳那批可乐退5瓶，单价3块5，从原料仓出'],
  ['复用+新建', '向供应商1采购牛皮纸 10卷，单价80元，入仓库1'],
];
$('#examples').innerHTML = EXAMPLES.map(([tag, t]) =>
  `<span class="tag tag-blue" style="cursor:pointer" data-t="${esc(t)}">${esc(tag)}｜${esc(t)}</span>`).join(' ');
$('#examples').onclick = e => {
  const el = e.target.closest('[data-t]');
  if (!el) return;
  $('#text').value = el.dataset.t;   // 只填入，不自动解析
  $('#text').focus();
};

// ---------- 会话流 ----------
let turns = [];                       // {type:'user'|'draft'|'result'|'pending', ...}
let pendingParse = false;
let stageTimers = [];

const CONV_KEY = 't2s_conv_v1';
function saveConv() {
  try {
    sessionStorage.setItem(CONV_KEY, JSON.stringify(turns
      .filter(t => t.type !== 'pending')
      .map(t => t.type === 'draft'
        ? { type: 'draft', draft: t.draft, rawText: t.rawText, attach: t.attach,
            state: t.state === 'open' ? 'cancelled' : t.state, revision: t.revision }
        : t)));
  } catch (e) {}
}
function loadConv() {
  try {
    turns = JSON.parse(sessionStorage.getItem(CONV_KEY) || '[]');
    if (!Array.isArray(turns)) turns = [];
  } catch (e) { turns = []; }
}

function draftSummary(d) {
  const bl = (BIZ[d.biz] || {}).label || d.biz || '';
  const its = (d.items || []).map(it => `${it.name || '?'}×${num(it.qty) || '?'}${it.unit || ''}`).join('、');
  return `${bl} · ${d.party || '？'} · ${its}`;
}

const STATE_TAG = {
  open:      '<span class="tag tag-blue">预览中</span>',
  cancelled: '<span class="tag t-gray">已取消</span>',
  committed: '<span class="tag tag-ok">已写入</span>',
};

function renderConv() {
  const el = $('#conv');
  if (!turns.length) {
    el.innerHTML = '<div class="conv-empty">左边说一句业务（或点示例），<br>解析出的草稿和写入结果会在这里按轮次展开。<br><br>💬 支持「改成 50 瓶」这样的多轮修正</div>';
    saveConv();
    return;
  }
  el.innerHTML = turns.map((t, i) => {
    if (t.type === 'user') {
      return `<div class="turn-user">${t.revision ? '<span class="rev-tag">修正</span>' : ''}${esc(t.text)}</div>`;
    }
    if (t.type === 'pending') {
      return `<div class="turn-thinking" id="__think">
        <span class="spinner spinner-dark"></span>
        <span class="stage">理解语义</span>
        <span class="stage-sep">→</span>
        <span class="stage">匹配档案</span>
        <span class="stage-sep">→</span>
        <span class="stage">生成预览</span>
      </div>`;
    }
    if (t.type === 'draft') {
      const d = t.draft || {};
      const items = (d.items || []).map(it =>
        `<div class="ln-item">${esc(it.name || '（未命名）')}　×${num(it.qty)} ${esc(it.unit || '')}　@￥${money(it.price)}</div>`).join('');
      const total = (d.items || []).reduce((s, it) => s + num(it.qty) * num(it.price), 0);
      const reopen = t.state === 'cancelled'
        ? `<div class="row-btns" style="margin-top:8px"><button class="btn btn-sm" data-reopen="${i}">↻ 重新预览</button>
           <button class="btn btn-sm btn-ghost" data-correct="${i}">继续修正</button></div>` : '';
      return `<div class="turn-card" data-turn="${i}">
        <div class="turn-hd">${esc((BIZ[d.biz] || {}).label || d.biz || '草稿')} ${STATE_TAG[t.state] || ''}</div>
        <div class="ln"><span class="k">${esc((BIZ[d.biz] || {}).party || '往来单位')}</span>${esc(d.party || '—')}${t.revision ? ' <span class="tag tag-fuzzy">多轮修正</span>' : ''}</div>
        <div class="ln"><span class="k">仓库</span>${esc(d.depot || '默认仓')}</div>
        <div class="ln-items">${items || '<span class="muted">无明细</span>'}</div>
        <div class="ln ln-total">合计 <b>￥${money(total)}</b></div>
        ${reopen}
      </div>`;
    }
    if (t.type === 'result') {
      if (t.ok) {
        const r = t.res || {};
        return `<div class="turn-result ok">✓ <b>${esc(r.biz_label || '')} ${esc(r.number || '')}</b> 已写入，合计 ￥${money(r.total)}
          ${(r.created && r.created.length) ? `<div class="hint">自动新建：${r.created.map(esc).join('、')}</div>` : ''}</div>`;
      }
      return `<div class="turn-result fail">✗ ${esc(t.msg || '失败')}</div>`;
    }
    return '';
  }).join('');
  el.scrollTop = el.scrollHeight;
  saveConv();
}

function startStages() {
  stageTimers.forEach(clearTimeout);
  stageTimers = [];
  $$('#conv .stage').forEach((s, i) => {
    stageTimers.push(setTimeout(() => s.classList.add('on'), 200 + i * 900));
  });
}
function stopStages() {
  stageTimers.forEach(clearTimeout);
  stageTimers = [];
}

// 修正模式：上一稿预览被取消后进入，下一句话作为对草稿的增量修改
let correcting = null;
function enterCorrect(draft) {
  correcting = { draft };
  renderChip();
  $('#text').focus();
}
function exitCorrect() { correcting = null; renderChip(); }
function renderChip() {
  const chip = $('#correctChip');
  if (!correcting) { chip.classList.add('hidden'); chip.innerHTML = ''; return; }
  chip.classList.remove('hidden');
  chip.innerHTML = `✏ 修正模式 · 接着说改哪里（例：「改成50瓶」「换原料仓」）<span class="hint">基于：${esc(draftSummary(correcting.draft))}</span>
    <span class="x" id="correctExit" title="退出修正模式，重新开一单">×</span>`;
  $('#correctExit').onclick = exitCorrect;
}

// ---------- 预览 / 提交 ----------
function openPreview(turn) {
  showPreview(turn.preview, turn.draft, (res, finalDraft) => handleCommitted(turn, res, finalDraft), turn.attach, {
    source: 'ai',
    rawText: turn.rawText,
    onCancel: d => {
      turn.state = 'cancelled';
      turn.draft = d;
      renderConv();
      enterCorrect(d);
    },
  });
}

function handleCommitted(turn, res, finalDraft) {
  if (finalDraft) turn.draft = finalDraft;   // 卡片展示实际写入的内容（含就地改数）
  if (!res.ok) {
    turn.state = 'cancelled';
    turns.push({ type: 'result', ok: false, msg: res.message || '写入失败' });
    renderConv();
    toast(res.message || '写入失败', 'bad');
    return;
  }
  turn.state = 'committed';
  turns.push({ type: 'result', ok: true, res });
  renderConv();
  toast('✓ ' + (res.message || '写入成功'));
  $('#text').value = '';
  exitCorrect();
  loadHistory();
}

$('#conv').onclick = async e => {
  const reopen = e.target.closest('[data-reopen]');
  const correct = e.target.closest('[data-correct]');
  if (reopen) {
    const turn = turns[+reopen.dataset.reopen];
    reopen.textContent = '预览中…';
    reopen.disabled = true;
    try {
      const r = await api('/api/resolve', { method: 'POST', body: { draft: turn.draft, source: 'ai' } });
      if (!r.ok) { toast(r.message || '重新预览失败', 'bad'); renderConv(); return; }
      turn.preview = r.preview;
      turn.state = 'open';
      renderConv();
      openPreview(turn);
    } catch (err) { toast(err.message, 'bad'); renderConv(); }
  } else if (correct) {
    const turn = turns[+correct.dataset.correct];
    enterCorrect(turn.draft);
  }
};

$('#convClear').onclick = () => {
  if (turns.length && !confirm('清空本次会话记录？（不影响已写入 ERP 的单据）')) return;
  turns = [];
  exitCorrect();
  renderConv();
};

// ---------- 解析 ----------
$('#parseBtn').onclick = () => doParse();
$('#text').addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); doParse(); }
});

async function doParse() {
  if (pendingParse) return;
  const text = $('#text').value.trim();
  if (!text) { toast('请先说一句业务', 'warn'); $('#text').focus(); return; }
  pendingParse = true;
  const btn = $('#parseBtn');
  btn.disabled = true; btn.textContent = 'AI 解析中…';

  const wasRevision = !!correcting;
  const prevDraft = wasRevision ? correcting.draft : null;
  turns.push({ type: 'user', text, revision: wasRevision });
  if (wasRevision) exitCorrect();      // 本轮修正指令已消费，预览取消后可再进
  turns.push({ type: 'pending' });
  renderConv();
  startStages();

  try {
    const body = { text };
    if (prevDraft) body.draft = prevDraft;
    const r = await api('/api/parse', { method: 'POST', body });
    turns = turns.filter(t => t.type !== 'pending');
    if (!r.ok) {
      turns.push({ type: 'result', ok: false, msg: r.message || '解析失败' });
      renderConv();
      if (r.need_config) openCfg();
      return;
    }
    const att = (attachMgr && !attachMgr.isEmpty()) ? attachMgr.getPaths().map(p => ({ path: p, name: p.split('/').pop() })) : [];
    const turn = {
      type: 'draft', draft: r.draft, preview: r.preview,
      rawText: text, attach: att, state: 'open', revision: wasRevision,
    };
    turns.push(turn);
    renderConv();
    openPreview(turn);
  } catch (e) {
    turns = turns.filter(t => t.type !== 'pending');
    turns.push({ type: 'result', ok: false, msg: e.message });
    renderConv();
  } finally {
    pendingParse = false;
    stopStages();
    btn.disabled = false; btn.textContent = '解析并预览 →';
  }
}

// ---------- 最近录单（审计日志只读视图） ----------
function fieldZh(f) {
  return String(f || '')
    .replace(/^items\[(\d+)\]\.name$/, (m, i) => `第${+i + 1}行商品名`)
    .replace(/^items\[(\d+)\]\.qty$/, (m, i) => `第${+i + 1}行数量`)
    .replace(/^items\[(\d+)\]\.unit$/, (m, i) => `第${+i + 1}行单位`)
    .replace(/^items\[(\d+)\]\.price$/, (m, i) => `第${+i + 1}行单价`)
    .replace(/^pay_amount$/, '实付金额')
    .replace(/^items\.length$/, '明细行数');
}

async function loadHistory() {
  try {
    const r = await api('/api/history?limit=15');
    if (!r.ok) return;
    const el = $('#recentList');
    el.innerHTML = (r.items || []).length ? r.items.map(h => `
      <div class="hist-row">
        <div class="hist-main">
          <span class="pill ${h.source === 'ai' ? 'pill-ai' : 'pill-form'}">${h.source === 'ai' ? 'AI' : '表单'}</span>
          <b>${esc(h.biz_label || '')} ${esc(h.number || '')}</b>
          <span class="amt">￥${money(h.total)}</span>
        </div>
        <div class="hist-sub" ${h.raw_text ? `title="原话：${esc(h.raw_text)}"` : ''}>
          ${h.raw_text ? `「${esc(h.raw_text)}」 · ` : ''}${esc(h.ts || '')}${(h.changed && h.changed.length)
            ? ` · 确认时改过：${h.changed.map(fieldZh).join('、')}` : ''}
        </div>
      </div>`).join('') : '<div class="muted center" style="padding:14px 0">还没有录过单，来说第一句吧</div>';
    $('#recentCard').style.display = '';
  } catch (e) { /* 审计读取失败不打断录单 */ }
}
$('#recentRefresh').onclick = loadHistory;

// ---------- 语音输入（浏览器原生，Firefox 不支持时自动隐藏） ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, recOn = false, recBase = '';
function setMic(on) {
  recOn = on;
  const b = $('#micBtn');
  b.classList.toggle('rec', on);
  b.textContent = on ? '■' : '🎤';
  b.title = on ? '正在听，点一下结束' : '语音输入';
  $('#text').classList.toggle('listening', on);
}
if (SR) {
  recog = new SR();
  recog.lang = 'zh-CN';
  recog.interimResults = true;
  recog.continuous = false;
  recog.onresult = e => {
    let s = '';
    for (const r of e.results) s += r[0].transcript;
    $('#text').value = (recBase + s).slice(0, 500);
  };
  recog.onend = () => { if (recOn) setMic(false); };
  recog.onerror = ev => {
    setMic(false);
    if (ev.error !== 'aborted' && ev.error !== 'no-speech') toast('语音识别失败：' + ev.error, 'warn');
  };
  $('#micBtn').style.display = '';
}
$('#micBtn').onclick = () => {
  if (!recog) return;
  if (recOn) { recog.stop(); return; }
  recBase = $('#text').value;
  try { recog.start(); setMic(true); } catch (e) { toast('语音没启动起来：' + e.message, 'warn'); }
};

// ---------- 模型设置 ----------
let CFG = null, editKey = null;

function openCfg() { $('#cfgMask').style.display = 'flex'; renderProfs(); }
$('#cfgBtn').onclick = openCfg;
$('#cfgClose').onclick = () => { $('#cfgMask').style.display = 'none'; };
$('#cfgMask').onclick = e => { if (e.target === $('#cfgMask')) $('#cfgMask').style.display = 'none'; };

async function loadCfg() {
  const r = await api('/api/config');
  CFG = r.config || r;              // server 把配置包在 config 里
  const llm = (CFG && CFG.llm) || {};
  const act = llm.profiles && llm.profiles[llm.active];
  $('#noModel').style.display = act ? 'none' : '';
  $('#modelTip').textContent = act ? ('当前模型：' + (act.name || llm.active) + ' / ' + act.model) : '';
  return CFG;
}

function renderProfs() {
  const llm = (CFG && CFG.llm) || { profiles: {} };
  const ps = llm.profiles || {};
  const keys = Object.keys(ps);
  $('#profList').innerHTML = keys.length ? keys.map(k => {
    const p = ps[k], on = llm.active === k;
    return `<div class="prof-item">
      <div>
        <b>${esc(p.name || k)}</b> ${on ? '<span class="tag tag-ok">使用中</span>' : ''}
        <div class="hint">${esc(p.model || '')} · ${esc(p.base_url || '')} · Key ${esc(p.api_key || '未设置')}</div>
      </div>
      <div class="row-btns">
        ${on ? '' : `<button class="btn btn-sm" data-use="${esc(k)}">启用</button>`}
        <button class="btn btn-sm btn-ghost" data-edit="${esc(k)}">编辑</button>
        <button class="btn btn-sm btn-danger" data-del="${esc(k)}">删除</button>
      </div>
    </div>`;
  }).join('') : '<div class="muted">还没有模型，展开下面「添加」新建一个。</div>';
}

$('#profList').onclick = async e => {
  const b = e.target.closest('button');
  if (!b) return;
  try {
    if (b.dataset.use) {
      const r = await api('/api/config/llm', { method: 'POST', body: { action: 'activate', key: b.dataset.use } });
      if (!r.ok) { toast(r.message || '切换失败', 'bad'); return; }
      await loadCfg(); renderProfs(); toast('已切换');
    } else if (b.dataset.del) {
      if (!confirm('确定删除这个模型？')) return;
      const r = await api('/api/config/llm?key=' + encodeURIComponent(b.dataset.del), { method: 'DELETE' });
      if (!r.ok) { toast(r.message || '删除失败', 'bad'); return; }
      await loadCfg(); renderProfs(); toast('已删除');
    } else if (b.dataset.edit) {
      const p = (CFG.llm.profiles || {})[b.dataset.edit] || {};
      editKey = b.dataset.edit;
      $('#p_name').value = p.name || ''; $('#p_base').value = p.base_url || '';
      $('#p_model').value = p.model || ''; $('#p_temp').value = p.temperature || 0;
      $('#p_key').value = '';
      $('#addFold').open = true;
      $('#p_msg').textContent = '正在编辑：' + (p.name || editKey) + '（Key 留空表示不修改）';
    }
  } catch (err) { toast(err.message, 'bad'); }
};

function formProf() {
  return {
    name: $('#p_name').value.trim(),
    base_url: $('#p_base').value.trim(),
    api_key: $('#p_key').value.trim(),
    model: $('#p_model').value.trim(),
    temperature: num($('#p_temp').value),
  };
}

$('#p_test').onclick = async () => {
  const p = formProf();
  if (!p.base_url || !p.model) { toast('请填 Base URL 和模型名', 'warn'); return; }
  $('#p_msg').textContent = '测试中…';
  try {
    const r = await api('/api/config/llm/test', { method: 'POST', body: Object.assign({ key: editKey }, p) });
    $('#p_msg').innerHTML = r.ok
      ? '<span style="color:#52c41a">✓ ' + esc(r.message || '连接成功') + '</span>'
      : '<span style="color:#ff4d4f">✗ ' + esc(r.message || '连接失败') + '</span>';
  } catch (e) { $('#p_msg').textContent = e.message; }
};

$('#p_save').onclick = async () => {
  const p = formProf();
  if (!p.base_url || !p.model) { toast('请填 Base URL 和模型名', 'warn'); return; }
  const key = editKey || (p.name || p.model).toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 24) || 'model';
  try {
    await api('/api/config/llm', { method: 'POST', body: { key, profile: p } });
    editKey = null;
    ['p_name', 'p_base', 'p_key', 'p_model'].forEach(i => { $('#' + i).value = ''; });
    $('#p_temp').value = 0;
    $('#p_msg').textContent = '';
    $('#addFold').open = false;
    await loadCfg(); renderProfs();
    toast('已保存');
  } catch (e) { toast(e.message, 'bad'); }
};

// ---------- 初始化 ----------
(async () => {
  try { await loadCfg(); } catch (e) { toast(e.message, 'bad'); }
  try { await loadMaster(); } catch (e) {}
  loadConv();
  renderConv();
  loadHistory();
  $('#text').focus();
})();
</script>
</body>
</html>
