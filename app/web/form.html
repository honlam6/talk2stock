<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>表单快速录入 · jshERP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="nav"></div>

<div class="wrap">

  <div class="card">
    <h2><span class="bar"></span>1. 选择业务类型</h2>
    <div class="biztabs" id="bizTabs"></div>
  </div>

  <div class="card">
    <h2><span class="bar"></span>2. 填写单据</h2>

    <div class="field">
      <label id="partyLabel">供应商</label>
      <div class="ac-wrap">
        <input id="party" type="text" placeholder="输入名称，没有的会自动新建" autocomplete="off">
      </div>
      <div id="partyHint" class="hint"></div>
    </div>

    <div class="tbl-wrap" style="margin-top:16px">
      <table class="xtable" id="tbl">
        <thead>
          <tr>
            <th style="min-width:190px">商品名称</th>
            <th style="width:100px" class="num">数量</th>
            <th style="width:90px">单位</th>
            <th style="width:110px" class="num">单价</th>
            <th style="width:120px" class="num">金额</th>
            <th style="width:50px"></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div style="margin-top:10px">
      <button class="btn btn-sm btn-ghost" id="addRow">＋ 添加一行</button>
      <span class="hint" style="margin-left:10px">最后一行按 Enter 或 Tab 自动加新行</span>
    </div>

    <div class="total-row">合计：<span class="amount" id="total">￥0.00</span></div>

    <div class="field" style="margin-top:12px">
      <label>附件（可选 · 原发票 / 单据扫描件 / 合同）</label>
      <div id="attachZone" class="attach-zone"></div>
    </div>

    <details class="fold">
      <summary>更多选项（仓库 / 日期 / 账户 / 备注 / 实付）</summary>
      <div class="fold-body">
        <div class="grid">
          <div class="field">
            <label>仓库</label>
            <select id="depot"></select>
          </div>
          <div class="field">
            <label>单据日期</label>
            <input id="operDate" type="date">
          </div>
          <div class="field">
            <label>结算账户</label>
            <select id="account"></select>
          </div>
          <div class="field">
            <label id="payLabel">付款方式</label>
            <select id="payType">
              <option value="现付">现付</option>
              <option value="预付款">预付款</option>
              <option value="记账">记账（挂账）</option>
            </select>
          </div>
          <div class="field">
            <label>本次实付金额</label>
            <input id="payAmount" type="number" step="0.01" placeholder="留空 = 全款结清">
            <div class="hint">填了且小于合计，差额自动记为欠款</div>
          </div>
          <div class="field">
            <label>备注</label>
            <input id="remark" type="text" placeholder="选填">
          </div>
        </div>
      </div>
    </details>

    <div class="row-btns" style="margin-top:20px">
      <button class="btn btn-ghost" id="clearBtn">清空</button>
      <button class="btn btn-primary btn-lg" id="previewBtn">预览并确认 →</button>
    </div>
  </div>

  <div class="card" id="histCard" style="display:none">
    <h2><span class="bar"></span>本次已录入</h2>
    <div id="hist"></div>
  </div>

</div>

<script src="/common.js"></script>
<script>
let biz = 'purchase_in';

// ---------- 顶栏 ----------
let attachMgr = null;

$('#nav').innerHTML = topbar('/form', '表单快速录入', '像填表一样录单据 · 不用 AI');

if (typeof AttachmentManager === 'function') {
  attachMgr = AttachmentManager($('#attachZone'), { biz: 'bill', max: 4 });
}

// ---------- 业务类型 ----------
$('#bizTabs').innerHTML = Object.entries(BIZ)
  .map(([k, v]) => `<div class="biztab${k === biz ? ' on' : ''}" data-k="${k}">${v.label}</div>`).join('');

$('#bizTabs').onclick = e => {
  const el = e.target.closest('.biztab');
  if (!el) return;
  biz = el.dataset.k;
  $$('.biztab').forEach(b => b.classList.toggle('on', b.dataset.k === biz));
  syncBiz();
};

function syncBiz() {
  const b = BIZ[biz];
  $('#partyLabel').textContent = b.party;
  $('#party').placeholder = `输入${b.party}名称，没有的会自动新建`;
  $('#payLabel').textContent = b.dir === 'in' ? '付款方式' : '收款方式';
  $('#payType').innerHTML = b.dir === 'in'
    ? '<option value="现付">现付</option><option value="预付款">预付款</option><option value="记账">记账（挂账）</option>'
    : '<option value="现收">现收</option><option value="预收款">预收款</option><option value="记账">记账（挂账）</option>';
  checkParty();
  // 默认仓库跟随方向
  const want = b.dir === 'in' ? '原料仓' : '成品仓';
  const opt = Array.from($('#depot').options).find(o => o.value === want);
  if (opt) $('#depot').value = want;
}

// ---------- 往来单位 ----------
function checkParty() {
  const v = $('#party').value.trim();
  const h = $('#partyHint');
  if (!v) { h.textContent = ''; h.className = 'hint'; return; }
  const hit = findExact(partyPool(biz), v);
  if (hit) {
    h.innerHTML = '<span style="color:#52c41a">✓ 系统中已有</span>';
  } else {
    h.innerHTML = `<span style="color:#fa8c16">⚠ 系统中无此${BIZ[biz].party}，提交时将自动新建</span>`;
  }
}

// ---------- 明细表 ----------
function rowHTML() {
  return `<tr>
    <td><div class="ac-wrap"><input class="c-name" type="text" placeholder="商品名称" autocomplete="off"></div></td>
    <td><input class="c-qty num" type="number" step="any" placeholder="0"></td>
    <td><input class="c-unit" type="text" placeholder="个"></td>
    <td><input class="c-price num" type="number" step="any" placeholder="0.00"></td>
    <td><input class="c-amt num" readonly tabindex="-1"></td>
    <td><button class="xdel" title="删除该行">×</button></td>
  </tr>`;
}

function bindRow(tr) {
  const name = $('.c-name', tr), qty = $('.c-qty', tr), unit = $('.c-unit', tr), price = $('.c-price', tr);

  autocomplete(name, () => MD.materials,
    it => { if (it.unit && !unit.value) unit.value = it.unit; calc(); },
    () => markNew(tr));

  [qty, price].forEach(i => i.addEventListener('input', calc));
  name.addEventListener('input', () => markNew(tr));

  $('.xdel', tr).onclick = () => {
    if ($$('#tbody tr').length > 1) tr.remove(); else clearRow(tr);
    calc();
  };

  // 最后一行 Enter / Tab 自动加行
  [name, qty, unit, price].forEach(inp => {
    inp.addEventListener('keydown', e => {
      const rows = $$('#tbody tr');
      const isLast = rows[rows.length - 1] === tr;
      if (e.key === 'Enter') {
        e.preventDefault();
        if (isLast && name.value.trim()) { addRow(); $$('#tbody tr').pop(); focusLast(); }
        else { const n = tr.nextElementSibling; (n ? $('.c-name', n) : name).focus(); }
      }
      if (e.key === 'Tab' && !e.shiftKey && inp === price && isLast && name.value.trim()) {
        e.preventDefault(); addRow(); focusLast();
      }
    });
  });
}

function markNew(tr) {
  const n = $('.c-name', tr);
  const v = n.value.trim();
  const isNew = v && !findExact(MD.materials, v);
  n.closest('td').classList.toggle('cell-new', !!isNew);
  n.title = isNew ? '系统中没有此商品，提交时将自动新建' : '';
}

function clearRow(tr) {
  $$('input', tr).forEach(i => { i.value = ''; });
  tr.querySelector('td').classList.remove('cell-new');
}

function addRow() {
  $('#tbody').insertAdjacentHTML('beforeend', rowHTML());
  bindRow($('#tbody').lastElementChild);
}

function focusLast() {
  const rows = $$('#tbody tr');
  $('.c-name', rows[rows.length - 1]).focus();
}

function calc() {
  let t = 0;
  $$('#tbody tr').forEach(tr => {
    const a = num($('.c-qty', tr).value) * num($('.c-price', tr).value);
    $('.c-amt', tr).value = a ? money(a) : '';
    t += a;
  });
  $('#total').textContent = '￥' + money(t);
  return t;
}

$('#addRow').onclick = () => { addRow(); focusLast(); };

// ---------- 收集草稿 ----------
function buildDraft() {
  const items = [];
  $$('#tbody tr').forEach(tr => {
    const n = $('.c-name', tr).value.trim();
    if (!n) return;
    items.push({
      name: n,
      qty: num($('.c-qty', tr).value),
      unit: $('.c-unit', tr).value.trim() || '个',
      price: num($('.c-price', tr).value),
    });
  });
  const d = {
    biz,
    party: $('#party').value.trim(),
    depot: $('#depot').value,
    items,
    oper_time: ($('#operDate').value || today()) + ' ' + nowStamp().slice(11),
    pay_type: $('#payType').value,
    remark: $('#remark').value.trim(),
  };
  const acc = $('#account').value;
  if (acc) d.account_id = parseInt(acc, 10);
  const pa = $('#payAmount').value;
  if (pa !== '') d.pay_amount = num(pa);
  return d;
}

// ---------- 预览 / 提交 ----------
$('#previewBtn').onclick = async () => {
  const d = buildDraft();
  if (!d.party) { toast('请填写' + BIZ[biz].party, 'warn'); $('#party').focus(); return; }
  if (!d.items.length) { toast('请至少填一行商品', 'warn'); focusLast(); return; }

  const btn = $('#previewBtn');
  btn.disabled = true; btn.textContent = '检查中…';
  try {
    const r = await api('/api/resolve', { method: 'POST', body: { draft: d } });
    if (!r.ok) { toast(r.message || '预览失败', 'bad'); return; }
    const att = (attachMgr && !attachMgr.isEmpty()) ? attachMgr.getPaths().map(p => ({ path: p, name: p.split('/').pop() })) : [];
    showPreview(r.preview, d, onCommitted, att);
  } catch (e) {
    toast(e.message, 'bad');
  } finally {
    btn.disabled = false; btn.textContent = '预览并确认 →';
  }
};

const hist = [];
function onCommitted(res) {
  if (!res.ok) { toast(res.message || '写入失败', 'bad'); return; }
  toast('✓ ' + (res.message || '写入成功'));
  hist.unshift(res);
  renderHist();
  // 保留业务类型和往来单位，清空明细，方便连续录入
  $('#tbody').innerHTML = '';
  addRow();
  calc();
  $('#remark').value = '';
  $('#payAmount').value = '';
  if (attachMgr) attachMgr.reset();
  focusLast();
}

function renderHist() {
  $('#histCard').style.display = hist.length ? '' : 'none';
  $('#hist').innerHTML = hist.map(r => `
    <div class="history-item">
      <b>${esc(r.biz_label || '')} ${esc(r.number || '')}</b>
      　合计 ￥${money(r.total)}
      ${(r.created && r.created.length)
        ? `<div class="hint">自动新建：${r.created.map(esc).join('、')}</div>` : ''}
    </div>`).join('');
}

$('#clearBtn').onclick = () => {
  $('#party').value = '';
  $('#remark').value = '';
  $('#payAmount').value = '';
  $('#tbody').innerHTML = '';
  addRow();
  calc();
  checkParty();
};

// ---------- 初始化 ----------
(async () => {
  $('#operDate').value = today();
  try {
    await loadMaster();
  } catch (e) {
    toast(e.message, 'bad');
  }
  $('#depot').innerHTML = MD.depots.map(d => `<option>${esc(d.name)}</option>`).join('');
  $('#account').innerHTML = '<option value="">默认账户</option>' +
    MD.accounts.map(a => `<option value="${a.id || ''}">${esc(a.name)}</option>`).join('');
  autocomplete($('#party'), () => partyPool(biz), null, checkParty);
  addRow();            // 主数据就绪后再建首行，自动补全才有数据
  syncBiz();
  calc();
})();
</script>
</body>
</html>
