<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台 · Talk2Stock</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">

  <!-- Hero：品牌区 + 指针光斑 + 入场动画（纯 CSS/JS） -->
  <section class="hero" id="hero">
    <div class="hero-grid-bg"></div>
    <div class="hero-glow" id="glow"></div>
    <div class="hero-in">
      <div class="hero-eyebrow"><span class="pulse"></span>对话式进销存智能体</div>
      <h1>把一句话，记成<br><span class="gold">一笔明明白白的账</span></h1>
      <p class="lead">说出业务，智能体拆成单据草稿；数字来历逐条标明，确认后才写入真实 ERP。全程留痕，随时可审。</p>
      <div class="hero-flow">
        <span class="hero-step"><b>说</b>一句话</span><span class="hero-arrow">→</span>
        <span class="hero-step">生成<b>草稿</b></span><span class="hero-arrow">→</span>
        <span class="hero-step">人工<b>确认</b></span><span class="hero-arrow">→</span>
        <span class="hero-step">写入 <b>ERP</b></span>
      </div>
    </div>
  </section>

  <!-- 快速操作 -->
  <div class="quick-grid">
    <a class="quick-card" href="/new?mode=ai">
      <span class="go">↗</span>
      <div class="ico">✎</div>
      <h3>对话录单</h3>
      <p id="aiDesc">说一句话建单，多轮修正、语音输入、附件随单。</p>
    </a>
    <a class="quick-card" href="/new?mode=form">
      <span class="go">↗</span>
      <div class="ico">▤</div>
      <h3>表单录单</h3>
      <p>逐字段精确控制，自动补全 + 键盘连录，不依赖 AI。</p>
    </a>
    <a class="quick-card" href="/ask">
      <span class="go">↗</span>
      <div class="ico">❝</div>
      <h3>问一问</h3>
      <p>「可乐还有多少」「谁欠我钱」——只读查询，不改数据。</p>
    </a>
    <a class="quick-card" href="/dashboard">
      <span class="go">↗</span>
      <div class="ico">◫</div>
      <h3>经营看板</h3>
      <p>采销毛利、欠款、库存预警、趋势图，老板视角一页看完。</p>
    </a>
  </div>

  <!-- KPI 顶条 -->
  <div style="margin-top:20px" class="kpi-grid" id="kpis">
    <div class="kpi b"><div class="lbl">加载中</div><div class="val">—</div></div>
  </div>

  <!-- 最近录单 + 系统状态 -->
  <div class="two-col" style="margin-top:20px">
    <div class="card" id="recentCard" style="display:none;margin-bottom:0">
      <h2><span class="bar"></span>最近录单
        <span style="flex:1"></span>
        <button class="btn btn-sm btn-ghost" id="recentRefresh">↻ 刷新</button>
      </h2>
      <div id="recentList"></div>
    </div>
    <div class="card" style="margin-bottom:0">
      <h2><span class="bar"></span>系统状态</h2>
      <div id="stat" class="muted">检查中…</div>
      <div id="llmStat" class="muted" style="margin-top:8px"></div>
    </div>
  </div>

</div>

<script src="/common.js"></script>
<script>
shell('/');

// 指针光斑（rAF 节流，离开即隐）
(() => {
  const hero = $('#hero'), glow = $('#glow');
  let raf = 0;
  hero.addEventListener('pointermove', e => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      const r = hero.getBoundingClientRect();
      glow.style.left = (e.clientX - r.left) + 'px';
      glow.style.top = (e.clientY - r.top) + 'px';
      raf = 0;
    });
  });
})();

// ---------- KPI（lite 接口） ----------
function renderKPI(d) {
  if (!d || d.ok === false) {
    $('#kpis').innerHTML = '<div class="kpi r"><div class="lbl">看板数据</div><div class="val">—</div><div class="sub">' +
      esc((d && d.message) || '无法获取') + '</div></div>';
    return;
  }
  const t = d.today || {}, st = d.stock || {};
  const warnN = (st.negative || 0) + (st.low || 0);
  $('#kpis').innerHTML = `
    <a class="kpi b" href="/dashboard"><div class="lbl">今日采购</div><div class="val">￥${money(t.buy)}</div><div class="sub">${t.buy_n || 0} 笔</div></a>
    <a class="kpi g" href="/dashboard"><div class="lbl">今日销售</div><div class="val">￥${money(t.sell)}</div><div class="sub">${t.sell_n || 0} 笔</div></a>
    <a class="kpi o" href="/dashboard"><div class="lbl">今日差额</div><div class="val">￥${money(t.profit)}</div><div class="sub">销售 − 采购</div></a>
    <a class="kpi r" href="/dashboard"><div class="lbl">应收欠款</div><div class="val">￥${money(d.debt_recv_total)}</div><div class="sub">${(d.debt_recv || []).length ? '最多：' + esc(d.debt_recv[0].name) : '暂无欠款'}</div></a>
    <a class="kpi ${warnN > 0 ? 'r' : 'g'}" href="/dashboard"><div class="lbl">库存预警</div><div class="val">${warnN}</div><div class="sub">负库存 ${st.negative || 0} · 低库存 ${st.low || 0}</div></a>`;
}
async function refreshKPI() {
  try { renderKPI(await api('/api/dashboard?lite=1')); } catch (e) { renderKPI(null); }
}

// ---------- 最近录单 ----------
function fieldZh(s) {
  return String(s || '')
    .replace(/^biz$/, '业务类型').replace(/^party$/, '往来单位').replace(/^depot$/, '仓库')
    .replace(/^oper_time$/, '日期').replace(/^remark$/, '备注')
    .replace(/^items\[(\d+)\]\.name$/, (m, i) => `第${+i + 1}行商品`)
    .replace(/^items\[(\d+)\]\.qty$/, (m, i) => `第${+i + 1}行数量`)
    .replace(/^items\[(\d+)\]\.unit$/, (m, i) => `第${+i + 1}行单位`)
    .replace(/^items\[(\d+)\]\.price$/, (m, i) => `第${+i + 1}行单价`)
    .replace(/^pay_amount$/, '实付金额');
}
async function refreshHistory() {
  try {
    const r = await api('/api/history?limit=8');
    if (!r.ok) return;
    $('#recentCard').style.display = '';
    $('#recentList').innerHTML = (r.items || []).length ? r.items.map(h => `
      <div class="hist-row">
        <div class="hist-main">
          <span class="pill ${h.source === 'ai' ? 'pill-ai' : 'pill-form'}">${h.source === 'ai' ? 'AI' : '表单'}</span>
          <b>${esc(h.biz_label || '')} ${esc(h.number || '')}</b>
          <span class="amt">￥${money(h.total)}</span>
        </div>
        <div class="hist-sub" ${h.raw_text ? `title="原话：${esc(h.raw_text)}"` : ''}>
          ${h.raw_text ? `「${esc(h.raw_text)}」 · ` : ''}${esc(h.ts || '')}${(h.changed && h.changed.length)
            ? ` · 确认时改过：${h.changed.map(fieldZh).join('、')}` : ''}
        </div>
      </div>`).join('') : '<div class="muted center" style="padding:14px 0">还没有录过单，去「录单」说第一句吧</div>';
  } catch (e) { /* 审计读取失败不打断首页 */ }
}
$('#recentRefresh').onclick = () => { refreshHistory(); refreshKPI(); };

// ---------- 状态 ----------
(async () => {
  refreshKPI(); refreshHistory();
  try {
    const r = await api('/api/config');
    const cfg = r.config || r;
    const llm = cfg.llm || {};
    const act = llm.profiles && llm.profiles[llm.active];
    $('#llmStat').innerHTML = act
      ? `<span class="tag tag-ok">AI 模型</span>　${esc(act.name || llm.active)} · ${esc(act.model || '')}`
      : `<span class="tag tag-new">AI 模型未配置</span>　<a href="/settings" style="color:var(--gold-strong)">去设置 →</a>（表单录单不受影响）`;
    if (!act) $('#aiDesc').innerHTML = '说一句话建单。<b style="color:var(--gold-strong)">需先配置模型 →</b>';
  } catch (e) {}
  try {
    const m = await loadMaster();
    const c = m.counts || {};
    $('#stat').innerHTML =
      `<span class="tag tag-ok">ERP 已连接</span>　` +
      `供应商 <b>${c.suppliers || 0}</b>　客户 <b>${c.customers || 0}</b>　` +
      `商品 <b>${c.materials || 0}</b>　仓库 <b>${c.depots || 0}</b>　账户 <b>${c.accounts || 0}</b>`;
  } catch (e) {
    $('#stat').innerHTML = `<span class="tag t-red">ERP 连不上</span>　${esc(e.message)}
      <div class="hint">到「设置」检查连接，或启动：cd ~/Desktop/jshERP-suite/jshERP-latest/deploy && docker compose up -d --no-build</div>`;
    renderKPI(null);
  }
})();
</script>
</body>
</html>
