<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1e8">
<title>智能助手 · Talk2Stock</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="agent-page">
<div class="agent-shell">
  <header class="agent-header">
    <div class="agent-brand"><span class="agent-mark">T</span><strong>智能助手</strong><span class="agent-presence">正在连接 ERP</span></div>
    <div class="agent-header-actions"><a href="/dashboard" title="经营看板" aria-label="经营看板">◫</a><a href="/settings" title="模型与账号设置" aria-label="模型与账号设置">⚙</a></div>
  </header>
  <main class="agent-main" id="main"><div class="agent-log" id="log" role="log" aria-live="polite"></div></main>
  <footer class="agent-dock">
    <div class="agent-suggestions" id="suggestions"><button data-q="今天采销怎么样？">今日经营</button><button data-q="可乐还有多少库存？">查库存</button><button data-q="谁欠我钱？">看欠款</button><button data-q="从美宜佳买30瓶可乐，单价3块5，入原料仓">录一单</button></div>
    <div class="agent-composer" id="composer">
      <button class="agent-icon" id="plus" title="添加图片或表格" aria-label="添加图片或表格" aria-expanded="false">＋</button>
      <textarea id="q" rows="1" maxlength="1000" placeholder="问经营，或说一句要办的事" aria-label="给智能助手发消息"></textarea>
      <button class="agent-icon agent-mic" id="mic" title="语音输入" aria-label="语音输入"></button>
      <button class="agent-send" id="send" aria-label="发送" title="发送"><span>↑</span></button>
    </div>
    <div class="agent-dock-foot"><span id="draftState">草稿确认后才会写入</span><span id="composerHint">Enter 发送 · Shift+Enter 换行</span></div>
    <div class="agent-thumbs" id="thumbs" hidden></div><input id="imageFile" type="file" accept="image/*,.pdf,.docx,.xlsx,.xlsm,.csv,.tsv,.txt,.md" multiple hidden>
  </footer>
</div>
<script src="/common.js"></script>
<script src="/import.js"></script>
<script>
(() => {
'use strict';
const $id = id => document.getElementById(id);
const log = $id('log'), q = $id('q'), send = $id('send'), suggestions = $id('suggestions');
const KEY = 't2s_agent_v2';
let turns = [], busy = false, controller = null, watchdog = null, pendingImages = [], activeDraft = null, currentBubble = null;
const TOOL_LABEL = {stock_query:'查询库存',low_stock:'检查库存预警',today_stats:'汇总今日经营',month_stats:'汇总本月经营',debts:'核算应收应付',recent_bills:'查看近期单据',stock_value:'计算库存货值',master_count:'统计档案',search_docs:'查阅操作指引',search_history:'检索历史',query_bills:'查询单据明细',sql_query:'核对业务数据',db_schema:'核对数据结构',draft_order:'生成与校验草稿',stock_check:'校验可用库存',last_price:'参考最近成交价',habit_defaults:'参考录入习惯',party_history:'核对往来记录',submit_verdict:'整理校验结论',response_review:'检查回答',decide:'重新思考'};
const TOOL_VERB = {stock_query:'正在查库存',low_stock:'正在看库存预警',today_stats:'正在汇总今日经营',month_stats:'正在汇总本月经营',debts:'正在核算欠款',recent_bills:'正在查近期单据',stock_value:'正在计算库存货值',master_count:'正在统计档案',search_docs:'正在查操作指引',search_history:'正在找历史记录',query_bills:'正在查单据',sql_query:'正在核对业务数据',draft_order:'正在整理并校验草稿',stock_check:'正在校验库存',last_price:'正在核对历史价格',habit_defaults:'正在参考录入习惯',party_history:'正在核对往来记录',submit_verdict:'正在整理校验结论'};
const readJSON = (storage, key, fallback) => { try { const v = JSON.parse(storage.getItem(key)); return v == null ? fallback : v; } catch (_) { return fallback; } };
function save() {
  try {
    const lean = turns.slice(-30).map(t => {
      if (t.kind !== 'answer') return t;
      return Object.assign({}, t, {images:[],drafts:(t.drafts || []).map(p => Object.assign({}, p, {
        bills:(p.bills || []).map(b => Object.assign({}, b, {confirm_token:'',
          preview:Object.assign({}, b.preview || {}, {confirm_token:''})})),
      }))});
    });
    sessionStorage.setItem(KEY, JSON.stringify(lean));
  } catch (_) { /* 本地会话超限时，不阻断本轮工作 */ }
}
function restore() {
  turns = readJSON(sessionStorage, KEY, []); if (!Array.isArray(turns)) turns = [];
  if (!turns.length) {
    const old = readJSON(sessionStorage, 't2s_ask_v1', []);
    if (Array.isArray(old)) turns = old.map(m => m.t === 'u' ? {kind:'user',text:m.q} : m.t === 'b' && m.r ? {kind:'answer',answer:m.r.answer,steps:m.r.steps || [],route:m.r.route,grounded:m.r.grounded} : null).filter(Boolean);
  }
  if (turns.length) renderHistory(); else welcome();
}
function node(cls, text) { const d = document.createElement('div'); d.className = cls; if (text != null) d.textContent = text; return d; }
function scrollEnd(smooth = true) { $id('main').scrollTo({top:$id('main').scrollHeight,behavior:smooth && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth':'auto'}); }
function welcome() {
  log.innerHTML = '<section class="agent-welcome"><div class="agent-orbit">T</div><p class="agent-eyebrow">YOUR BUSINESS, IN CONVERSATION</p><h1>今天，想处理什么？</h1><p>查一笔账，或录一张单。</p><div class="agent-welcome-actions"><button data-q="帮我看看今天经营得怎么样">看看今天的经营 <span>↗</span></button><button data-q="从美宜佳买30瓶可乐，单价3块5，入原料仓">说一句话，开始录单 <span>↗</span></button></div></section>';
}
function userView(t) {
  const d = node('agent-turn agent-user', t.text); log.appendChild(d);
  if (t.files && t.files.length) {
    const files = node('agent-user-files');
    t.files.forEach(f => files.appendChild(node('agent-user-file', '▧ ' + (f.name || '附件'))));
    d.appendChild(files);
  }
  if (t.images && t.images.length) { const images = node('agent-message-images'); t.images.forEach(src => { const img = document.createElement('img'); img.src = src; img.alt = '随消息发送的单据图片'; images.appendChild(img); }); d.appendChild(images); }
}
function stepView(s) {
  const detail = document.createElement('details'); detail.className = 'agent-step' + (s.ok === false ? ' is-error':'');
  const summary = document.createElement('summary'); summary.innerHTML = '<span class="agent-step-dot"></span><span>' + esc(TOOL_LABEL[s.tool] || s.tool || '重新思考') + '</span>' + (s.latency_ms ? '<time>' + s.latency_ms + 'ms</time>':'') + '<span class="agent-step-caret">⌄</span>';
  const body = node('agent-step-body'); if (s.thought) body.appendChild(node('agent-thought', s.thought));
  if (s.observation != null) { const pre = document.createElement('pre'); pre.textContent = JSON.stringify(s.observation, null, 2).slice(0,3000); body.appendChild(pre); }
  detail.append(summary,body); return detail;
}
function answerView(t) {
  const article = node('agent-turn agent-answer'); if (t.error) article.classList.add('agent-error');
  article.appendChild(node('agent-answer-text',t.answer || t.message || '这次没有完成，请换个说法再试。'));
  const steps = (t.steps || []).filter(s => s.tool || s.correction);
  if (steps.length) {
    const trace = document.createElement('details'); trace.className = 'agent-trace'; const summary = document.createElement('summary'); const n = steps.filter(s => s.tool && s.ok).length;
    summary.innerHTML = '<span class="agent-trace-icon">✓</span><span>已完成 · ' + n + ' 次工具调用</span><span class="agent-trace-more">过程</span>';
    trace.appendChild(summary); const box = node('agent-trace-list'); steps.forEach(s => box.appendChild(stepView(s))); trace.appendChild(box); article.appendChild(trace);
  }
  (t.drafts || []).forEach(p => article.appendChild(draftView(p,t))); log.appendChild(article); return article;
}
function draftSummary(payload) {
  return (payload.bills || []).map(b => { const d = b.draft || {}, p = b.preview || {}; return {biz:(BIZ[d.biz] || {}).label || d.biz || '业务草稿',party:d.party || '待补往来单位',depot:d.depot || '',total:p.total || 0,items:d.items || [],attachments:(b.attach || payload.attachments || []).map(a => a.name || a).filter(Boolean),warnings:p.warnings || [],errors:p.errors || []}; });
}
function draftView(payload,parent) {
  const wrap = node('agent-draft-card'), bills = payload.bills || [];
  const head = node('agent-draft-head'); head.innerHTML = '<span class="agent-draft-icon">▤</span><strong>单据草稿</strong><span>' + bills.length + ' 张</span>'; wrap.appendChild(head);
  bills.forEach(b => { const d = b.draft || {}, p = b.preview || {}, row = node('agent-draft-row'); const items = (d.items || []).map(i => esc(i.name || '待补商品') + ' × ' + esc(i.qty) + esc(i.unit || '')).join(' · '); const files = (b.attach || payload.attachments || []).map(a => esc(a.name || a)).join('、'); row.innerHTML = '<div><b>' + esc((BIZ[d.biz] || {}).label || '业务单据') + '</b><span>' + esc(d.party || '待补往来单位') + '</span><small>' + items + '</small>' + (files ? '<small class="agent-draft-file">▧ ' + files + '</small>' : '') + '</div><strong>￥' + money(p.total || 0) + '</strong>'; wrap.appendChild(row); });
  const problems = bills.reduce((n,b) => n + ((b.preview || {}).errors || []).length,0); if (problems) wrap.appendChild(node('agent-notice','有 ' + problems + ' 项待补，打开草稿即可修改。'));
  const foot = node('agent-draft-foot'), btn = document.createElement('button'); btn.className = 'btn btn-primary';
  const stored = parent && parent.draftCommitted && parent.draftCommitted.batch_id === payload.batch_id;
  btn.textContent = stored ? '已写入 ERP':'核对草稿'; btn.disabled = !!stored;
  btn.onclick = () => openDrafts(payload,parent,btn); foot.appendChild(btn); foot.appendChild(node('agent-draft-status',stored ? '✓ 已确认写入':'确认后写入')); wrap.appendChild(foot); return wrap;
}
function openDrafts(payload,parent,btn) {
  activeDraft = payload; $id('draftState').textContent = '可继续用自然语言修改这张草稿';
  const bills = (payload.bills || []).map(b => Object.assign({},b,{state:'open'})); if (!bills.length) { toast('草稿内容为空，请补充商品与数量','warn'); return; }
  if (bills.some(b => !b.confirm_token)) {
    // 刷新后的旧令牌不会进入会话存储；重新只读预览才能生成新的确认依据。
    api('/api/sheet/resolve',{method:'POST',body:{drafts:bills.map((b,i) => ({row_no:i + 1,draft:b.draft}))}})
      .then(r => { if (!r.ok) throw new Error(r.message || '重新预览失败'); payload.bills = r.bills || []; openDrafts(payload,parent,btn); })
      .catch(e => { btn.disabled = false; toast(e.message,'bad'); });
    return;
  }
  btn.disabled = true; loadMaster().then(() => {
    showMultiPreview(bills,{source:'ai',rawText:payload.raw_text || '',onClose:updated => {
      btn.disabled = false; const committed = (updated || []).filter(b => b.state === 'committed');
      if (committed.length) {
        if (parent) { parent.draftCommitted = {batch_id:payload.batch_id,count:committed.length}; }
        btn.textContent = '已写入 ERP'; btn.disabled = true; const status = btn.parentElement.querySelector('.agent-draft-status'); if (status) status.textContent = '✓ ' + committed.length + ' 张已写入';
        activeDraft = null; $id('draftState').textContent = '已写入 · 可以继续问经营';
        turns.push({kind:'answer',answer:'已写入 ' + committed.length + ' 张单据，单据编号：' + committed.map(b => (b.res || {}).number || '已生成').join('、'),steps:[]}); save(); renderHistory();
      }
    }});
  }).catch(e => { btn.disabled = false; toast(e.message,'bad'); });
}
function workingView() {
  const article = node('agent-turn agent-answer agent-working'), live = node('agent-working-line'); live.innerHTML = '<span class="agent-thinking"></span><span>正在理解你的需求</span>'; article.appendChild(live);
  const trace = node('agent-live-steps'); article.appendChild(trace); log.appendChild(article); scrollEnd(); return {article,live,trace,steps:[]};
}
function eventStep(s) { if (!s.tool && !s.correction) return; currentBubble.steps.push(s); const v = stepView(s); v.open = s.ok === false; currentBubble.trace.appendChild(v); scrollEnd(); }
function compactPayload(p) { return {batch_id:p.batch_id || '',raw_text:p.raw_text || '',meta:p.meta || {},bills:(p.bills || []).map(b => ({draft:b.draft,preview:b.preview,confirm_token:b.confirm_token,attach:b.attach || []})),attachments:p.attachments || [],clarify:p.clarify || null}; }
function finishWorking(r,drafts) {
  if (!r || r.ok === false) throw new Error((r && r.message) || '这次请求没有完成');
  const t = {kind:'answer',answer:r.answer,route:r.route,grounded:r.grounded,steps:r.steps && r.steps.length ? r.steps : currentBubble.steps,tokens:r.tokens,drafts:drafts.map(compactPayload)};
  turns.push(t); save(); const next = answerView(t); currentBubble.article.replaceWith(next); currentBubble = null;
  const last = drafts[drafts.length - 1];
  if (last) { activeDraft = last; const missing = last.clarify && last.clarify.question; $id('draftState').textContent = missing || '可继续用自然语言修改这张草稿'; if (missing) toast(missing,'warn'); else toast('草稿已生成，点卡片核对','ok'); }
  scrollEnd();
}
function currentDraftPayload() {
  // 单张草稿时带上结构化草稿（模型可精准修改）；多单不猜，交给模型用自然语言重写
  return (activeDraft && activeDraft.bills && activeDraft.bills.length === 1) ? activeDraft.bills[0].draft : null;
}
function historyPayload() {
  const recent = turns.slice(-10).map(t => {
    if (t.kind === 'user') return {role:'user',content:t.text};
    if (t.kind === 'answer') { let content = t.answer || ''; (t.drafts || []).forEach(p => { content += '\n草稿：' + JSON.stringify(draftSummary(p)); }); return {role:'assistant',content}; }
    return null;
  }).filter(Boolean);
  if (activeDraft && activeDraft.bills && activeDraft.bills.length) recent.push({role:'assistant',content:'当前待修改草稿（尚未写入）：' + JSON.stringify(draftSummary(activeDraft)) + '。用户说「改成」「换仓库」等默认指这张草稿，不要把它当成修改 ERP 已有单据。'});
  return recent;
}
async function doAskWithFiles(text) {
  text = (text || '').trim();
  if (busy || !pendingImages.length) return;
  if (pendingImages.some(p => p.busy)) { toast('附件正在准备，请稍候','warn'); return; }
  const files = pendingImages.slice();
  const user = {kind:'user',text:text || '请识别这些附件并生成草稿',files:files.map(p => ({name:p.name,type:p.file.type || p.file.name.split('.').pop()})),images:files.filter(p => p.isImage && p.dataUrl).map(p => p.dataUrl)};
  turns.push(user); save();
  if (log.querySelector('.agent-welcome')) log.innerHTML = '';
  userView(user); suggestions.hidden = true;
  pendingImages = []; renderThumbs(); q.value = ''; resizeInput(); setBusy(true);
  currentBubble = workingView();
  currentBubble.live.lastElementChild.textContent = '正在读取附件并规划…';
  const fd = new FormData();
  fd.append('text', text);
  fd.append('history', JSON.stringify(historyPayload()));
  fd.append('draft', JSON.stringify(currentDraftPayload()));
  files.forEach((p, i) => fd.append('file' + i, p.file, p.name));
  try {
    const pass = localStorage.getItem('t2s_pass');
    const headers = pass ? {'X-T2S-Pass':pass} : {};
    const resp = await fetch('/api/ask/files', {method:'POST',headers,body:fd});
    const txt = await resp.text();
    let r;
    try { r = JSON.parse(txt); } catch (_) { throw new Error('服务返回异常：' + txt.slice(0,120)); }
    if (resp.status === 401) throw new Error('登录已过期，请刷新后重新登录');
    if (!r.ok) throw new Error(r.message || '附件处理失败');
    finishWorking(r, r.drafts || []);
  } catch (e) {
    if (currentBubble) currentBubble.article.remove();
    currentBubble = null;
    turns.push({kind:'answer',answer:e.message || '附件处理失败',error:true,steps:[]});
    save(); renderHistory();
  } finally {
    setBusy(false); q.focus({preventScroll:true});
  }
}
async function doAsk(text) {
  text = (text || '').trim(); if (busy) return;
  if (pendingImages.length) return doAskWithFiles(text);
  if (!text) return;
  const user = {kind:'user',text:text || '识别这张单据'};
  if (pendingImages.length) { user.images = pendingImages.map(p => p.dataUrl).filter(Boolean); user.imageCount = pendingImages.length; }
  turns.push(user); save(); if (log.querySelector('.agent-welcome')) log.innerHTML = ''; userView(user); suggestions.hidden = true;
  const images = pendingImages.map(p => p.dataUrl).filter(Boolean); pendingImages = []; renderThumbs(); q.value = ''; resizeInput(); setBusy(true); currentBubble = workingView();
  controller = new AbortController(); let gotAny = false, completed = false; const drafts = [];
  const timer = () => { clearTimeout(watchdog); watchdog = setTimeout(() => controller && controller.abort(),120000); }; timer();
  try {
    const headers = {'Content-Type':'application/json'}, pass = localStorage.getItem('t2s_pass'); if (pass) headers['X-T2S-Pass'] = pass;
    const resp = await fetch('/api/ask/stream',{method:'POST',headers,body:JSON.stringify({text:text || '识别图片并生成单据草稿',images,history:historyPayload(),draft:currentDraftPayload()}),signal:controller.signal});
    if (!resp.ok || !resp.body) throw new Error('连接未完成（HTTP ' + resp.status + '）');
    const reader = resp.body.getReader(), decoder = new TextDecoder(); let buffer = '';
    while (true) {
      const read = await reader.read(); timer(); if (read.done) break; buffer += decoder.decode(read.value,{stream:true}); let idx;
      while ((idx = buffer.indexOf('\n\n')) >= 0) {
        const chunk = buffer.slice(0,idx); buffer = buffer.slice(idx + 2); const line = chunk.split('\n').find(l => l.startsWith('data:')); if (!line) continue;
        let ev; try { ev = JSON.parse(line.slice(5)); } catch (_) { continue; } gotAny = true;
        if (ev.type === 'action') currentBubble.live.lastElementChild.textContent = (TOOL_VERB[ev.tool] || '正在处理') + '…';
        else if (ev.type === 'step') eventStep(ev.step);
        else if (ev.type === 'draft') { if (!drafts.some(p => p.batch_id && p.batch_id === (ev.payload || {}).batch_id)) drafts.push(ev.payload || {}); currentBubble.live.lastElementChild.textContent = '草稿已整理好'; }
        else if (ev.type === 'done') { const r = ev.result || {}; finishWorking(r,r.drafts && r.drafts.length ? r.drafts : drafts); completed = true; }
        else if (ev.type === 'error') throw new Error(ev.message || '请求未完成');
      }
    }
    if (!completed) throw new Error('连接中断，这次没有写入数据');
  } catch (e) {
    if (currentBubble) currentBubble.article.remove(); currentBubble = null;
    const stopped = controller && controller._stopped;
    const msg = stopped ? '已停止。已生成的内容不会自动写入。' : e.name === 'AbortError' ? '等待超时。可重试，或缩小这次任务。' : e.message;
    turns.push({kind:'answer',answer:msg,error:true,steps:[]}); save();
    if (!gotAny && !stopped && e.name !== 'AbortError' && !images.length) {
      try { const r = await api('/api/ask',{method:'POST',body:{text,images,history:historyPayload(),draft:currentDraftPayload()}}); turns.pop(); currentBubble = workingView(); finishWorking(r,r.drafts || []); }
      catch (fallback) { turns.push({kind:'answer',answer:fallback.message,error:true,steps:[]}); renderHistory(); }
    } else renderHistory();
  } finally { clearTimeout(watchdog); controller = null; setBusy(false); q.focus({preventScroll:true}); }
}
function setBusy(v) { busy = v; send.classList.toggle('is-stop',v); send.innerHTML = '<span>' + (v ? '■':'↑') + '</span>'; send.title = v ? '停止生成':'发送'; }
function resizeInput() { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight,144) + 'px'; }
function renderThumbs() {
  const el = $id('thumbs'); el.hidden = !pendingImages.length;
  el.innerHTML = pendingImages.map((p,i) => '<span class="agent-thumb" title="' + esc(p.name || '') + '">' + (p.isImage && p.dataUrl ? '<img src="' + p.dataUrl + '" alt="待识别图片">' : '<span class="agent-thumb-doc">' + esc((p.name || '文件').split('.').pop().toUpperCase().slice(0,5)) + '</span>') + '<button data-remove="' + i + '" aria-label="移除附件">×</button></span>').join('');
}
async function addImages(files) {
  const docExt = /\.(pdf|docx|xlsx|xlsm|csv|tsv|txt|md)$/i;
  for (const f of Array.from(files || [])) {
    const isImage = !!(f.type && f.type.startsWith('image/'));
    if (!isImage && !docExt.test(f.name || '')) { toast('支持图片、PDF、Word、Excel/CSV、文本文件','warn'); continue; }
    if (f.size > 8 * 1024 * 1024) { toast('「' + f.name + '」超过 8MB，请压缩或拆分','warn'); continue; }
    if (pendingImages.length >= 6) { toast('一次最多 6 个附件','warn'); break; }
    const p = {file:f,name:f.name || '附件',isImage,busy:true,dataUrl:null}; pendingImages.push(p); renderThumbs();
    if (isImage) {
      try { const c = await compressImage(f); p.dataUrl = c.dataUrl; } catch (_) { toast('这张图片读取失败，请换一张','bad'); }
    }
    p.busy = false; renderThumbs();
  }
  q.placeholder = pendingImages.length ? '说说这些附件分别是什么业务，或直接发送' : '问经营，或说一句要办的事';
}
function attachmentMenu() {
  const old = $id('attachMenu'); if (old) { old.remove(); $id('plus').setAttribute('aria-expanded','false'); return; }
  const menu = node('agent-attach-menu'); menu.id = 'attachMenu'; menu.innerHTML = '<button id="chooseImage"><span>▧</span><div><b>附件与单据照片</b><small>多选图片、PDF、Word、Excel</small></div></button><button id="chooseSheet"><span>▦</span><div><b>表格导入与修复</b><small>先核对字段，再生成草稿</small></div></button><a href="/new?mode=form"><span>▤</span><div><b>手动填写</b><small>逐字段录入</small></div></a>';
  $id('composer').appendChild(menu); $id('plus').setAttribute('aria-expanded','true');
  $id('chooseImage').onclick = () => { menu.remove(); $id('imageFile').click(); };
  $id('chooseSheet').onclick = () => { menu.remove(); if (!window.ImportDialog) { location.href = '/new?mode=import'; return; } ImportDialog.open({onDrafts:p => { const t = {kind:'answer',answer:'表格已整理成 ' + (p.bills || []).length + ' 张草稿。',steps:[],drafts:[p]}; turns.push(t); save(); renderHistory(); activeDraft = p; $id('draftState').textContent = '可继续用自然语言修改这张草稿'; }}); };
}
function renderHistory() { log.innerHTML = ''; if (!turns.length) { welcome(); suggestions.hidden = false; return; } turns.forEach(t => t.kind === 'user' ? userView(t) : t.kind === 'answer' ? answerView(t):null); suggestions.hidden = true; scrollEnd(false); }
function newChat() { if (busy && controller) { controller._stopped = true; controller.abort(); } turns = []; activeDraft = null; pendingImages = []; renderThumbs(); try { sessionStorage.removeItem(KEY); } catch (_) {} $id('draftState').textContent = '草稿确认后才会写入'; renderHistory(); q.value = ''; resizeInput(); q.focus({preventScroll:true}); }
send.onclick = () => { if (busy && controller) { controller._stopped = true; controller.abort(); } else doAsk(q.value); };
q.addEventListener('input',resizeInput); q.addEventListener('keydown',e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!busy) doAsk(q.value); } });
q.addEventListener('paste',e => { const files = Array.from((e.clipboardData || {}).items || []).filter(x => x.kind === 'file' && x.type.startsWith('image/')).map(x => x.getAsFile()).filter(Boolean); if (files.length) { e.preventDefault(); addImages(files); } });
['dragover','dragleave','drop'].forEach(type => $id('composer').addEventListener(type,e => { e.preventDefault(); $id('composer').classList.toggle('is-drag',type === 'dragover'); if (type === 'drop') addImages(e.dataTransfer.files); }));
$id('plus').onclick = attachmentMenu; $id('imageFile').onchange = e => { addImages(e.target.files); e.target.value = ''; };
$id('thumbs').onclick = e => { const b = e.target.closest('[data-remove]'); if (b) { pendingImages.splice(+b.dataset.remove,1); renderThumbs(); } };
document.addEventListener('click',e => { const m = $id('attachMenu'); if (m && !e.target.closest('#composer')) { m.remove(); $id('plus').setAttribute('aria-expanded','false'); } });
document.addEventListener('click',e => { const b = e.target.closest('[data-q]'); if (b && !busy) doAsk(b.dataset.q); });
const mic = $id('mic'), SR = window.SpeechRecognition || window.webkitSpeechRecognition;
mic.innerHTML = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
if (!SR) mic.hidden = true;
else { let recording = null, base = ''; mic.onclick = () => { if (recording) { recording.stop(); return; } if (!window.isSecureContext) { toast('语音输入需要 HTTPS 或本地访问','warn'); return; } const r = new SR(); recording = r; base = q.value; r.lang = 'zh-CN'; r.interimResults = true; mic.classList.add('is-recording'); r.onresult = e => { let s = ''; for (let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript; q.value = base + s; resizeInput(); }; r.onerror = e => { if (!['no-speech','aborted'].includes(e.error)) toast('语音识别暂不可用，请直接输入','warn'); }; r.onend = () => { recording = null; mic.classList.remove('is-recording'); q.focus({preventScroll:true}); }; try { r.start(); } catch (_) { recording = null; mic.classList.remove('is-recording'); } }; }
const newBtn = document.createElement('button'); newBtn.className = 'agent-new'; newBtn.title = '新建对话'; newBtn.setAttribute('aria-label','新建对话'); newBtn.textContent = '＋'; newBtn.onclick = newChat; document.querySelector('.agent-header-actions').prepend(newBtn);
api('/api/master').then(() => { const p = document.querySelector('.agent-presence'); if (p) { p.textContent = 'ERP 在线'; p.classList.add('is-online'); } }).catch(() => { const p = document.querySelector('.agent-presence'); if (p) { p.textContent = 'ERP 待连接'; p.classList.add('is-offline'); } });
restore(); resizeInput(); if (!matchMedia('(pointer:coarse)').matches) q.focus({preventScroll:true});
})();
</script>
</body>
