<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1e8">
<title>Talk2Stock · ERP Agent</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="agent-page">
<div class="chat-app">
  <aside class="chat-side" id="side" aria-label="对话历史">
    <div class="chat-side-top">
      <span class="chat-side-title">对话</span>
      <button class="chat-side-fold" id="sideFold" title="收起侧栏" aria-label="收起侧栏">«</button>
    </div>
    <div class="chat-side-actions"><button class="chat-side-new" id="sideNew" title="新对话" aria-label="新对话">＋ 新对话</button></div>
    <nav class="chat-side-nav" aria-label="主要入口">
      <a href="/dashboard"><span class="csn-ico">◫</span>经营看板</a>
      <a href="/new"><span class="csn-ico">▤</span>录单</a>
      <a href="/settings"><span class="csn-ico">⚙</span>设置</a>
    </nav>
    <div class="chat-side-list" id="sideList" role="list"></div>
    <div class="chat-side-foot"><span class="chat-side-user" id="sideUser"></span></div>
  </aside>
  <div class="chat-side-mask" id="sideMask" hidden></div>
  <div class="agent-shell">
  <header class="agent-header">
    <div class="agent-brand"><button class="agent-menu" id="menuBtn" title="展开对话历史" aria-label="展开对话历史" aria-expanded="false">☰</button><span class="agent-mark" id="brandMark" title="Talk2Stock · ERP Agent"></span><strong>ERP Agent</strong><span class="agent-presence">正在连接 ERP</span></div>
    <div class="agent-header-actions"><a href="/dashboard" title="经营看板" aria-label="经营看板"><span class="ha-ico">◫</span><span class="ha-txt">看板</span></a><a href="/settings" title="模型与账号设置" aria-label="模型与账号设置"><span class="ha-ico">⚙</span><span class="ha-txt">设置</span></a></div>
  </header>
  <main class="agent-main" id="main"><div class="agent-log" id="log" role="log" aria-live="polite"></div></main>
  <footer class="agent-dock">
    <div class="agent-suggestions" id="suggestions"><button data-q="今天采销怎么样？">今日经营</button><button data-q="可乐还有多少库存？">查库存</button><button data-q="谁欠我钱？">看欠款</button><button data-q="从美宜佳买30瓶可乐，单价3块5，入原料仓">录一单</button></div>
    <div class="agent-composer" id="composer">
      <button class="agent-icon" id="plus" title="添加图片或表格" aria-label="添加图片或表格" aria-expanded="false">＋</button>
      <textarea id="q" rows="1" maxlength="1000" placeholder="问经营，或说一句要办的事" aria-label="给 ERP Agent 发消息"></textarea>
      <button class="agent-icon agent-mic" id="mic" title="语音输入" aria-label="语音输入"></button>
      <button class="agent-send" id="send" aria-label="发送" title="发送"><span>↑</span></button>
    </div>
    <div class="agent-dock-foot"><span id="draftState">草稿确认后写入</span><span id="ctxState"></span><span id="composerHint">Enter 发送 · Shift+Enter 换行</span></div>
    <div class="agent-thumbs" id="thumbs" hidden></div><input id="imageFile" type="file" accept="image/*,.pdf,.docx,.xlsx,.xlsm,.csv,.tsv,.txt,.md" multiple hidden>
  </footer>
  </div>
</div>
<script src="/common.js"></script>
<script src="/import.js"></script>
<script>
(() => {
'use strict';
const $id = id => document.getElementById(id);
const log = $id('log'), q = $id('q'), send = $id('send'), suggestions = $id('suggestions');
const KEY = 't2s_agent_v2';
const TOOL_LABEL = {stock_query:'查询库存',low_stock:'检查库存预警',today_stats:'汇总今日经营',month_stats:'汇总本月经营',debts:'核算应收应付',recent_bills:'查看近期单据',stock_value:'计算库存货值',master_count:'统计档案',search_docs:'查阅操作指引',search_history:'检索历史',query_bills:'查询单据明细',procurement_suggest:'计算补货建议',sql_query:'核对业务数据',db_schema:'核对数据结构',draft_order:'生成与校验草稿',stock_check:'校验可用库存',last_price:'参考最近成交价',habit_defaults:'参考录入习惯',party_history:'核对往来记录',submit_verdict:'整理校验结论',response_review:'检查回答',decide:'重新思考'};
const TOOL_VERB = {stock_query:'正在查库存',low_stock:'正在看库存预警',today_stats:'正在汇总今日经营',month_stats:'正在汇总本月经营',debts:'正在核算欠款',recent_bills:'正在查近期单据',stock_value:'正在计算库存货值',master_count:'正在统计档案',search_docs:'正在查操作指引',search_history:'正在找历史记录',query_bills:'正在查单据',procurement_suggest:'正在核对库存与销量',sql_query:'正在核对业务数据',draft_order:'正在整理并校验草稿',stock_check:'正在校验库存',last_price:'正在核对历史价格',habit_defaults:'正在参考录入习惯',party_history:'正在核对往来记录',submit_verdict:'正在整理校验结论'};

/* ---- 像素头像：40×40 手绘 rect，整数倍缩放（聊天 40px / 欢迎页 160px） ---- */
const AV_IMG = { agent: '/avatars/agent-cat-v3.jpg', user: '/avatars/user-bear-v2.jpg' };
function avatarHTML(kind) { return '<img src="' + AV_IMG[kind] + '" alt="" decoding="async">'; }
function avatarEl(kind) {
  const el = document.createElement('span');
  el.className = 'agent-avatar agent-avatar-' + kind;
  el.setAttribute('aria-hidden', 'true');
  el.innerHTML = avatarHTML(kind);
  return el;
}
$id('brandMark').innerHTML = avatarHTML('agent');
const motionOK = () => !matchMedia('(prefers-reduced-motion: reduce)').matches;
let heroRect = null;
let turns = [], busy = false, controller = null, watchdog = null, pendingImages = [], activeDraft = null, currentBubble = null;
let convs = {active:'', items:[]}, currentId = '', saveTimer = null;

/* ---- 会话侧栏：服务端按登录用户持久化，多端同一账号同步 ---- */
const sideList = $id('sideList'), side = $id('side'), sideMask = $id('sideMask');
function relTime(ts) {
  if (!ts) return '';
  const d = Math.floor((Date.now() - ts) / 1000);
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
  if (d < 86400) return Math.floor(d / 3600) + ' 小时前';
  if (d < 86400 * 7) return Math.floor(d / 86400) + ' 天前';
  const x = new Date(ts), p = n => String(n).padStart(2, '0');
  return (x.getMonth() + 1) + '/' + p(x.getDate());
}
function renderSide() {
  sideList.innerHTML = '';
  const items = convs.items || [];
  if (!items.length) { sideList.innerHTML = '<p class="chat-side-empty">还没有历史对话。<br>发一句话就会自动保存。</p>'; return; }
  items.forEach(it => {
    const row = node('chat-side-item' + (it.id === currentId ? ' is-active' : ''));
    row.setAttribute('role', 'listitem');
    const open = document.createElement('button');
    open.type = 'button'; open.className = 'chat-side-open';
    open.innerHTML = '<span class="csi-title"></span><span class="csi-meta"></span>';
    open.querySelector('.csi-title').textContent = it.title || '未命名对话';
    open.querySelector('.csi-meta').textContent = (it.count || 0) + ' 条 · ' + relTime(it.updated);
    open.onclick = () => openConv(it.id);
    const tools = node('chat-side-tools');
    const rn = document.createElement('button'); rn.type = 'button'; rn.title = '重命名'; rn.textContent = '✎';
    rn.onclick = e => { e.stopPropagation(); renameConv(it); };
    const del = document.createElement('button'); del.type = 'button'; del.title = '删除'; del.textContent = '×';
    del.onclick = e => { e.stopPropagation(); deleteConv(it); };
    tools.append(rn, del);
    row.append(open, tools);
    sideList.appendChild(row);
  });
}
async function loadConvs() {
  const r = await api('/api/conversations');
  if (!r.ok) throw new Error(r.message || '会话列表读取失败');
  convs = {active: r.active || '', items: r.items || []};
  renderSide();
}
function titleOf() {
  const t = turns.find(x => x.kind === 'user' && (x.text || '').trim());
  return t ? t.text.trim().slice(0, 40) : '';
}
function leanTurns() {
  return turns.slice(-30).map(t => {
    if (t.kind === 'user') { const o = {kind: 'user', text: t.text}; if (t.files) o.files = t.files.map(f => ({name: f.name, type: f.type || ''})); return o; }
    const o = {kind: 'answer', answer: t.answer, steps: t.steps || []};
    ['error', 'tokens', 'elapsed', 'route', 'grounded'].forEach(k => { if (t[k] != null) o[k] = t[k]; });
    if (t.meta && t.meta.model) o.meta = {model: t.meta.model};
    o.drafts = (t.drafts || []).map(p => ({batch_id: p.batch_id, raw_text: p.raw_text, meta: p.meta,
      bills: (p.bills || []).map(b => ({draft: b.draft, preview: b.preview, attach: b.attach || []})),
      check: p.check ? {patches_suggested: p.check.patches_suggested || [], patches_applied: p.check.patches_applied || [], risks: p.check.risks || ''} : null,
      attachments: p.attachments || [], clarify: p.clarify || null}));
    return o;
  });
}
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const r = await api('/api/conversations', {method: 'POST', body: {action: 'upsert', id: currentId, title: titleOf(), turns: leanTurns()}});
      if (r.ok && r.item) { currentId = r.item.id; convs.active = r.item.id; const i = convs.items.findIndex(x => x.id === r.item.id); if (i >= 0) convs.items[i] = r.item; else convs.items.unshift(r.item); renderSide(); }
    } catch (_) { /* 会话保存失败不阻断本轮对话 */ }
  }, 220);
}
async function openConv(id) {
  if (busy) { toast('等这一轮完成再切换会话', 'warn'); return; }
  if (id === currentId) { closeSide(); return; }
  try {
    const r = await api('/api/conversations?id=' + encodeURIComponent(id));
    if (!r.ok || !r.item) throw new Error(r.message || '会话读取失败');
    currentId = id; turns = r.item.turns || []; activeDraft = null;
    $id('draftState').textContent = '草稿确认后写入';
    renderHistory(); renderSide(); ctxNote(); closeSide();
    try { sessionStorage.removeItem(KEY); } catch (_) {}
  } catch (e) { toast(e.message, 'bad'); }
}
async function deleteConv(it) {
  const ok = await askInline({
    title: '删除「' + (it.title || '未命名对话') + '」？',
    hint: '此操作不可恢复，不会影响已写入 ERP 的单据。',
    okText: '删除',
  }).then(v => v !== null).catch(() => false);
  if (!ok) return;
  try {
    const r = await api('/api/conversations', {method: 'POST', body: {action: 'delete', id: it.id}});
    if (!r.ok) throw new Error(r.message || '删除失败');
    convs = {active: r.active || '', items: r.items || []};
    if (currentId === it.id) { currentId = ''; turns = []; renderHistory(); ctxNote(); }
    renderSide(); toast('已删除', 'ok');
  } catch (e) { toast(e.message, 'bad'); }
}
async function renameConv(it) {
  const v = await askInline({
    title: '重命名对话',
    input: true,
    value: it.title || '',
    placeholder: '输入新的会话标题',
    okText: '保存',
  }).catch(() => null);
  if (v == null) return;
  try {
    const r = await api('/api/conversations', {method: 'POST', body: {action: 'rename', id: it.id, title: v}});
    if (!r.ok) throw new Error(r.message || '重命名失败');
    convs = {active: r.active || convs.active, items: r.items || convs.items};
    renderSide();
  } catch (e) { toast(e.message, 'bad'); }
}
function openSide() { side.classList.add('is-open'); sideMask.hidden = false; $id('menuBtn').setAttribute('aria-expanded', 'true'); }
function closeSide() { side.classList.remove('is-open'); sideMask.hidden = true; $id('menuBtn').setAttribute('aria-expanded', 'false'); }
function ctxNote() {
  $id('ctxState').textContent = turns.length ? '上下文 · 最近 ' + Math.min(turns.length, 10) + ' 条' : '';
}
const readJSON = (storage, key, fallback) => { try { const v = JSON.parse(storage.getItem(key)); return v == null ? fallback : v; } catch (_) { return fallback; } };
function save() {
  try {
    const lean = turns.slice(-30).map(t => {
      if (t.kind !== 'answer') return t;
      return Object.assign({}, t, {images:[],drafts:(t.drafts || []).map(p => Object.assign({}, p, {
        bills:(p.bills || []).map(b => Object.assign({}, b, {confirm_token:'',
          preview:Object.assign({}, b.preview || {}, {confirm_token:''})})),
      }))});
    });
    sessionStorage.setItem(KEY, JSON.stringify(lean));
  } catch (_) { /* 本地会话超限时，不阻断本轮工作 */ }
}
function restore() {
  turns = readJSON(sessionStorage, KEY, []); if (!Array.isArray(turns)) turns = [];
  if (!turns.length) {
    const old = readJSON(sessionStorage, 't2s_ask_v1', []);
    if (Array.isArray(old)) turns = old.map(m => m.t === 'u' ? {kind:'user',text:m.q} : m.t === 'b' && m.r ? {kind:'answer',answer:m.r.answer,steps:m.r.steps || [],route:m.r.route,grounded:m.r.grounded} : null).filter(Boolean);
  }
}
function node(cls, text) { const d = document.createElement('div'); d.className = cls; if (text != null) d.textContent = text; return d; }
function scrollEnd(smooth = true) { $id('main').scrollTo({top:$id('main').scrollHeight,behavior:smooth && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth':'auto'}); }
const CAPS = [
  {ico:'◔', t:'今日经营', d:'采销与现金流一屏汇总', q:'今天采销怎么样？'},
  {ico:'▤', t:'库存预警', d:'负库存/低库存扫描', q:'库存有哪些不足？'},
  {ico:'¥', t:'应收应付', d:'谁欠我、我欠谁', q:'谁欠我钱？'},
  {ico:'▦', t:'单据检索', d:'按条件查历史单据', q:'最近有哪些采购单？'},
  {ico:'✦', t:'一句话录单', d:'自然语言起草并校验', q:'从美宜佳买30瓶可乐，单价3块5，入原料仓'},
  {ico:'↻', t:'采购建议', d:'按销量算该补什么', q:'哪些商品该补货？建议采购多少？'},
  {ico:'▣', t:'查库存', d:'指定商品现有多少', q:'可乐还有多少库存？'},
  {ico:'◫', t:'库存货值', d:'按仓库核算金额', q:'库存现在值多少钱？'},
];
function welcome() {
  log.innerHTML = '<section class="agent-welcome">'
    + '<div class="am-stage">'
    + '<span class="am-orbit" aria-hidden="true"></span><span class="am-orbit-dot" aria-hidden="true"></span>'
    + '<span class="am-portrait" id="heroAgent" role="img" aria-label="Talk2Stock ERP Agent">' + avatarHTML('agent') + '</span>'
    + '<span class="am-nameplate"><i class="am-dot"></i>Talk2Stock · ERP Agent</span>'
    + '<span class="am-spark am-s1" aria-hidden="true">✦</span><span class="am-spark am-s2" aria-hidden="true">✦</span><span class="am-spark am-s3" aria-hidden="true">✦</span>'
    + '</div>'
    + '<p class="agent-eyebrow">TALK2STOCK · ERP AGENT</p><h1>今天，先处理哪件事？</h1>'
    + '<p class="am-lede">我是 ERP Agent。说一句话，我会查 ERP 数据、核库存、找凭证；多步取证后再给结论，写库前先给你过目。</p>'
    + '<div class="agent-cap-grid">' + CAPS.map(c => '<button data-q="' + esc(c.q) + '"><span class="cap-ico">' + c.ico + '</span><b>' + c.t + '</b><small>' + c.d + '</small></button>').join('') + '</div>'
    + '<p class="agent-cap-note">支持多轮改稿 · 附件识别 · 表格导入 · 写库前人工确认</p></section>';
}
function userView(t, idx) {
  const row = node('agent-turn agent-turn-user');
  const main = node('agent-turn-main');
  const d = node('agent-user', t.text);
  if (t.files && t.files.length) {
    const files = node('agent-user-files');
    t.files.forEach(f => files.appendChild(node('agent-user-file', '▧ ' + (f.name || '附件'))));
    d.appendChild(files);
  }
  if (t.images && t.images.length) { const images = node('agent-message-images'); t.images.forEach(src => { const img = document.createElement('img'); img.src = src; img.alt = '随消息发送的单据图片'; images.appendChild(img); }); d.appendChild(images); }
  if (idx != null && idx >= 0) {
    const tools = node('agent-msg-tools');
    const ed = document.createElement('button');
    ed.type = 'button'; ed.className = 'agent-msg-act'; ed.textContent = '编辑重发';
    ed.onclick = () => editTurn(idx);
    tools.appendChild(ed); d.appendChild(tools);
  }
  main.appendChild(d);
  row.append(main, avatarEl('user'));
  log.appendChild(row);
}
function editTurn(i) {
  if (busy) { toast('等这一轮完成再修改', 'warn'); return; }
  const t = turns[i];
  if (!t || t.kind !== 'user') return;
  q.value = t.text || '';
  turns = turns.slice(0, i);
  activeDraft = null;
  $id('draftState').textContent = '草稿确认后写入';
  renderHistory(); ctxNote(); resizeInput(); q.focus({preventScroll:true});
  persist();
  toast('已放回输入框，修改后发送', 'ok');
}
async function copyText(text, btn) {
  const done = () => { if (btn) { const old = btn.textContent; btn.textContent = '已复制'; setTimeout(() => { btn.textContent = old; }, 1200); } };
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); done(); return; }
  } catch (_) { /* 回退到 execCommand */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done();
  } catch (_) { toast('复制失败，请手动选择文本', 'warn'); }
}
function argBrief(s) {
  const a = (s && s.args) || {};
  const out = [];
  ['biz','party','name','qty','unit','depot','keyword','text','days','limit'].forEach(k => {
    const v = a[k];
    if (v == null || v === '') return;
    out.push(String(v));
  });
  return out.slice(0, 3).join(' · ').slice(0, 44);
}
function fmtTok(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); }
function runMeta(t) {
  const parts = [];
  const model = ((t.meta && t.meta.model) || '').split('/').pop();
  if (model) parts.push(model);
  if (t.steps && t.steps.length) parts.push(t.steps.length + ' 步');
  if (t.elapsed) parts.push(t.elapsed + 's');
  const tk = t.tokens ? (Number(t.tokens.prompt || 0) + Number(t.tokens.completion || 0)) : 0;
  if (tk) parts.push(fmtTok(tk) + ' tok');
  return parts.join(' · ');
}
function stepView(s, idx) {
  const detail = document.createElement('details');
  detail.className = 'agent-step' + (s.correction ? ' is-correct' : (s.ok === false ? ' is-error' : ''));
  const label = TOOL_LABEL[s.tool] || s.tool || (s.correction ? '自我校验' : (s.ok === false ? '未完成' : '思考'));
  const brief = argBrief(s);
  const summary = document.createElement('summary');
  summary.innerHTML = '<span class="agent-step-idx">' + (idx != null ? idx : '') + '</span>'
    + '<span class="agent-step-dot"></span><span class="agent-step-name">' + esc(label) + '</span>'
    + (brief ? '<em class="agent-step-args">' + esc(brief) + '</em>' : '')
    + (s.latency_ms ? '<time>' + s.latency_ms + 'ms</time>' : '')
    + '<span class="agent-step-caret">⌄</span>';
  const body = node('agent-step-body');
  if (s.correction) body.appendChild(node('agent-thought', '自我校验：回答里出现观察之外的数字，已拦截并让模型按证据重答。'));
  if (s.thought) body.appendChild(node('agent-thought', '判断：' + s.thought));
  const obs = s.observation && typeof s.observation === 'object' ? (s.observation.error || s.observation) : s.observation;
  if (obs != null) { const pre = document.createElement('pre'); pre.textContent = (typeof obs === 'string' ? obs : JSON.stringify(obs, null, 2)).slice(0,3000); body.appendChild(pre); }
  else if (s.error) body.appendChild(node('agent-thought', String(s.error)));
  detail.append(summary,body); return detail;
}
async function retryAsk(user) {
  setBusy(true);
  controller = new AbortController();
  currentBubble = workingView();
  setLive('正在重试…');
  try {
    const r = await api('/api/ask', {method:'POST', signal:controller.signal, body:{text:user.text, images:user.images || [], history:historyPayload(), draft:currentDraftPayload()}});
    finishWorking(r, r.drafts || []);
  } catch (e) {
    if (currentBubble && currentBubble.tick) clearInterval(currentBubble.tick);
    if (currentBubble) currentBubble.article.remove();
    currentBubble = null;
    turns.push({kind:'answer', answer:e.name === 'AbortError' ? '已停止重试。' : (e.message || '重试失败'), error:true, steps:[]});
    save(); persist(); renderHistory();
  } finally { controller = null; setBusy(false); }
}
function retryTurn(t) {
  if (busy) { toast('等这一轮完成再重试','warn'); return; }
  const idx = turns.indexOf(t);
  if (idx < 0) return;
  let u = idx - 1;
  while (u >= 0 && turns[u].kind !== 'user') u--;

  $id('chooseSheet').onclick = () => { menu.remove(); if (!window.ImportDialog) { location.href = '/new?mode=import'; return; } ImportDialog.open({onDrafts:p => { const t = {kind:'answer',answer:'表格已整理成 ' + (p.bills || []).length + ' 张草稿。',steps:[],drafts:[p]}; turns.push(t); save(); persist(); renderHistory(); activeDraft = p; $id('draftState').textContent = '可继续用自然语言修改这张草稿'; }}); };
}
function renderHistory() { log.innerHTML = ''; if (!turns.length) { welcome(); suggestions.hidden = true; return; } turns.forEach((t, i) => t.kind === 'user' ? userView(t, i) : t.kind === 'answer' ? answerView(t, i) : null); suggestions.hidden = true; scrollEnd(false); }
function newChat() {
  clearTimeout(saveTimer);
  if (busy && controller) { controller._stopped = true; controller.abort(); }
  turns = []; currentId = ''; activeDraft = null; pendingImages = []; heroRect = null;
  renderThumbs(); try { sessionStorage.removeItem(KEY); } catch (_) {}
  $id('draftState').textContent = '草稿确认后写入';
  renderHistory(); ctxNote(); q.value = ''; resizeInput(); q.focus({preventScroll:true}); closeSide();
}
send.onclick = () => { if (busy && controller) { controller._stopped = true; controller.abort(); } else doAsk(q.value); };
q.addEventListener('input',resizeInput); q.addEventListener('keydown',e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!busy) doAsk(q.value); } });
window.addEventListener('resize',resizeInput);
q.addEventListener('paste',e => { const files = Array.from((e.clipboardData || {}).items || []).filter(x => x.kind === 'file' && x.type.startsWith('image/')).map(x => x.getAsFile()).filter(Boolean); if (files.length) { e.preventDefault(); addImages(files); } });
['dragover','dragleave','drop'].forEach(type => $id('composer').addEventListener(type,e => { e.preventDefault(); $id('composer').classList.toggle('is-drag',type === 'dragover'); if (type === 'drop') addImages(e.dataTransfer.files); }));
$id('plus').onclick = attachmentMenu; $id('imageFile').onchange = e => { addImages(e.target.files); e.target.value = ''; };
$id('thumbs').onclick = e => { const b = e.target.closest('[data-remove]'); if (b) { pendingImages.splice(+b.dataset.remove,1); renderThumbs(); } };
document.addEventListener('click',e => { const m = $id('attachMenu'); if (m && !e.target.closest('#composer')) { m.remove(); $id('plus').setAttribute('aria-expanded','false'); } });
document.addEventListener('click',e => { const b = e.target.closest('[data-q]'); if (b && !busy) doAsk(b.dataset.q); });
const mic = $id('mic'), SR = window.SpeechRecognition || window.webkitSpeechRecognition;
mic.innerHTML = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
if (!SR) mic.hidden = true;
else { let recording = null, base = ''; mic.onclick = () => { if (recording) { recording.stop(); return; } if (!window.isSecureContext) { toast('语音输入需要 HTTPS 或本地访问','warn'); return; } const r = new SR(); recording = r; base = q.value; r.lang = 'zh-CN'; r.interimResults = true; mic.classList.add('is-recording'); r.onresult = e => { let s = ''; for (let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript; q.value = base + s; resizeInput(); }; r.onerror = e => { if (!['no-speech','aborted'].includes(e.error)) toast('语音识别暂不可用，请直接输入','warn'); }; r.onend = () => { recording = null; mic.classList.remove('is-recording'); q.focus({preventScroll:true}); }; try { r.start(); } catch (_) { recording = null; mic.classList.remove('is-recording'); } }; }
$id('menuBtn').onclick = () => {
  if (matchMedia('(max-width:900px)').matches) { side.classList.contains('is-open') ? closeSide() : openSide(); return; }
  const app = document.querySelector('.chat-app');
  const collapsed = app.classList.toggle('side-collapsed');
  try { localStorage.setItem('t2s_side_collapsed', collapsed ? '1' : '0'); } catch (_) {}
};
$id('sideFold').onclick = () => {
  if (matchMedia('(max-width:900px)').matches) { closeSide(); return; }
  document.querySelector('.chat-app').classList.add('side-collapsed');
  try { localStorage.setItem('t2s_side_collapsed', '1'); } catch (_) {}
};
$id('sideNew').onclick = newChat;
sideMask.onclick = closeSide;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSide(); });
try { if (localStorage.getItem('t2s_side_collapsed') === '1') document.querySelector('.chat-app').classList.add('side-collapsed'); } catch (_) {}
api('/api/master').then(() => { const p = document.querySelector('.agent-presence'); if (p) { p.textContent = 'ERP 在线'; p.classList.add('is-online'); } }).catch(() => { const p = document.querySelector('.agent-presence'); if (p) { p.textContent = 'ERP 待连接'; p.classList.add('is-offline'); } });
// 启动：优先恢复服务端当前会话，其次本地兜底（迁移旧会话时首次发送会自动落库）
(async function boot() {
  try { await loadConvs(); } catch (_) { renderSide(); }
  if (convs.active) {
    try {
      const r = await api('/api/conversations?id=' + encodeURIComponent(convs.active));
      if (r.ok && r.item) { currentId = convs.active; turns = r.item.turns || []; }
    } catch (_) { /* 服务端不可用时退回本地缓存 */ }
  }
  if (!turns.length) restore();
  renderHistory(); ctxNote(); renderSide();
  api('/api/auth/me').then(me => { if (me && !me.local) $id('sideUser').textContent = me.username || me.login || ''; }).catch(() => {});
  resizeInput(); if (!matchMedia('(pointer:coarse)').matches) q.focus({preventScroll:true});
})();
})();
</script>
