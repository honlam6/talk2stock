<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>问一问 · Talk2Stock</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <div id="ph"></div>

  <div class="chat-wrap">
    <div class="chat-log" id="log"></div>
    <div class="ask-samples" id="askSamples">
      <span class="tag tag-new" style="cursor:pointer" data-q="可乐还有多少库存？">可乐还有多少库存？</span>
      <span class="tag tag-new" style="cursor:pointer" data-q="今天卖了多少？">今天卖了多少？</span>
      <span class="tag tag-new" style="cursor:pointer" data-q="谁欠我钱？">谁欠我钱？</span>
      <span class="tag tag-new" style="cursor:pointer" data-q="什么货快没了？">什么货快没了？</span>
    </div>
    <div class="chat-input-row">
      <textarea id="q" rows="1" placeholder="问一句经营数据…"></textarea>
      <button class="btn btn-primary" id="send">提问</button>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
shell('/ask');
$('#ph').innerHTML = pageHead('ASK', '问一问', '库存 / 采销 / 欠款，随口问，答案带数据来源');

const log = $('#log');

// 空状态引导（首问之后自动消失）。
// 不用白色气泡：引导不是"AI 回复"，做成全宽居中的欢迎版式，
// 与真实回复（气泡）在视觉上区分开。窄屏刻意做矮，一屏要装下输入框。
(function emptyState() {
  const d = document.createElement('div');
  d.className = 'ask-hello';
  d.innerHTML = `
    <div class="ah-ico">❝</div>
    <div class="ah-t">问一句，就对账</div>
    <div class="ah-d">库存余量 · 今日 / 本月采销 · 谁欠谁钱 · 哪些货快没了 · 库存值多少钱</div>
    <div class="ah-note">所有回答只读 · 数字实时取自 ERP</div>`;
  log.appendChild(d);
})();

// 空状态里的示例 chip 现在放在输入框上方（ask-samples），提问后隐藏该行
$('#askSamples').addEventListener('click', e => {
  const el = e.target.closest('[data-q]');
  if (el) doAsk(el.dataset.q);
});

function add(cls, text, src) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  if (src) {
    const s = document.createElement('span');
    s.className = 'src';
    s.textContent = '数据来源：' + src;
    d.appendChild(s);
  }
  log.appendChild(d);
  d.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return d;
}

const TOOL_LABEL = {
  stock_query: '库存查询（实时）', low_stock: '库存预警（实时）',
  today_stats: '今日经营（官方统计接口）', month_stats: '本月经营（官方统计接口）',
  debts: '应收应付（单据 debt 字段）', recent_bills: '最近单据', stock_value: '库存货值（官方统计接口）',
};

async function doAsk(q) {
  if (!q.trim()) return;
  add('user', q);
  $('#q').value = '';
  $('#askSamples').style.display = 'none';     // 提问后收起示例行
  const empty = log.querySelector('.msg.bot .empty');
  if (empty) empty.closest('.msg.bot').remove();     // 首次提问后收起引导
  const pending = document.createElement('div');
  pending.className = 'msg bot';
  pending.innerHTML = `
    <div style="min-width:220px">
      <div class="skel skel-text w-60"></div>
      <div class="skel skel-text w-80"></div>
      <div class="skel skel-text w-40"></div>
    </div>`;
  log.appendChild(pending);
  pending.scrollIntoView({ behavior: 'smooth', block: 'end' });
  try {
    const r = await api('/api/ask', { method: 'POST', body: { text: q } });
    pending.remove();
    if (!r.ok) { add('bot err', r.message || '查询失败'); return; }
    add('bot', r.answer || '（无回答）', r.tool && r.tool !== 'none' ? (TOOL_LABEL[r.tool] || r.tool) : '');
  } catch (e) {
    pending.remove();
    add('bot err', e.message);
  }
}

$('#send').onclick = () => doAsk($('#q').value);
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doAsk($('#q').value); }
});
document.querySelectorAll('[data-q]').forEach(el =>
  el.onclick = () => doAsk(el.dataset.q));

$('#q').focus();
</script>
</body>
</html>
